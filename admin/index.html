        email: cfg.email || D.cfg.email,
        phone: cfg.phone || D.cfg.phone,
        wa: cfg.wa || D.cfg.wa,

        signup: cfg.allow_signup !== false,
        maint: !!cfg.maintenance,

        mk: Number(cfg.mk) || D.cfg.mk,
        neg: Number(cfg.neg) || D.cfg.neg,
        dis: cfg.disclaimer || D.cfg.dis,

          priv: cfg.legal_privacy || D.cfg.legal?.priv,

// ==========================================
// STEP-BY-STEP ACCORDION WIZARD FOR TEST CREATION
// ==========================================
let WIZ_STEP = 1; // 1: Title & Banner, 2: Exam, 3: Hierarchy & Questions, 4: Access, 5: Timing, 6: Rules, 7: Review
let Q_TARGET = { sub: '', ch: '', tp: '' };

function initHierarchyTree(t) {
  if (!t.hierarchy_tree) t.hierarchy_tree = [];
  if (t.sub && t.sub.on && t.sub.v && !t.hierarchy_tree.some(s => s.name === t.sub.v)) {
    let subObj = { name: t.sub.v, ch_on: !!(t.ch && t.ch.on), chapters: [] };
    if (t.ch && t.ch.on && t.ch.v) {
      let chObj = { name: t.ch.v, tp_on: !!(t.tp && t.tp.on), topics: [] };
      if (t.tp && t.tp.on && t.tp.v) {
        chObj.topics.push(t.tp.v);
      }
      subObj.chapters.push(chObj);
    }
    t.hierarchy_tree.push(subObj);
  }
  // Sync from existing questions
  (t.q || []).forEach(q => {
    let s = (q.subject || '').trim();
    let c = (q.chapter || '').trim();
    let p = (q.topic || '').trim();
    if (s) {
      let sObj = t.hierarchy_tree.find(x => x.name === s);
      if (!sObj) {
        sObj = { name: s, ch_on: !!c, chapters: [] };
        t.hierarchy_tree.push(sObj);
      }
      if (c) {
        sObj.ch_on = true;
        let cObj = sObj.chapters.find(x => x.name === c);
        if (!cObj) {
          cObj = { name: c, tp_on: !!p, topics: [] };
          sObj.chapters.push(cObj);
        }
        if (p) {
          cObj.tp_on = true;
          if (!cObj.topics.includes(p)) cObj.topics.push(p);
        }
      }
    }
  });
}

function syncTestHierarchyFields(t) {
  if (t.hierarchy_tree && t.hierarchy_tree.length > 0) {
    t.sub.on = true;
    t.sub.v = t.hierarchy_tree[0].name;
    let firstCh = t.hierarchy_tree[0].chapters && t.hierarchy_tree[0].chapters[0];
    if (firstCh) {
      t.ch.on = true;
      t.ch.v = firstCh.name;
      let firstTp = firstCh.topics && firstCh.topics[0];
      if (firstTp) {
        t.tp.on = true;
        t.tp.v = typeof firstTp === 'string' ? firstTp : firstTp.name;
      } else {
        t.tp.on = false; t.tp.v = '';
      }
    } else {
      t.ch.on = false; t.ch.v = '';
      t.tp.on = false; t.tp.v = '';
    }
  }
}

function setWizStep(n) {
  WIZ_STEP = n;
  QE = -1;
  QF = null;
  QM = "manual";
  render();
  scrollTo(0, 0);
}

function edit(i) {
  let t = tid(i);
  if (!t) return go("tests");
  E = t;
  initHierarchyTree(t);
  let isLive = t.status === "pub";

  // If opening an existing completed test without active step, go to review
  if (t.title && t.exam && t.q && t.q.length > 0 && WIZ_STEP === 1 && !t._fresh) {
    WIZ_STEP = 7;
  }
  delete t._fresh;

  lay("tests", esc(t.title) || "Test Creation", `
    <div class="rowx" style="margin:-8px 0 14px">
      <a class="bkb" style="margin:0" href="#tests">${ic("back")}<span>Tests</span></a>
      <span style="margin-left:auto; display:flex; align-items:center; gap:8px;">
        <span class="idc-tag">#${esc(t.id)}</span>
        <span class="st2 ${t.status}">${t.status === "pub" ? "Live" : "Private Draft"}</span>
        <button class="b ${isLive ? 's' : 'o s'}" onclick="saveCurrentTestToCloud()">${ic("check")} ${isLive ? "Save Changes" : "Save Draft"}</button>
      </span>
    </div>

    <!-- STEP PROGRESS TRACKER -->
    <div class="stp" style="margin-bottom:14px;">
      ${[
        [1, "Title & Banner"],
        [2, "Exam"],
        [3, "Hierarchy & Qs"],
        [4, "Access"],
        [5, "Timer & Marks"],
        [6, "Rules"],
        [7, "Review & Finalize"]
      ].map(([n, title]) => `
        <button class="${WIZ_STEP == n ? "on" : ""}${n < WIZ_STEP ? " dn" : ""}" ${n <= WIZ_STEP ? `onclick="setWizStep(${n})"` : 'disabled style="opacity:0.45;cursor:not-allowed;"'}>
          <span>${n < WIZ_STEP ? ic("check") : n}</span>${title}
        </button>
      `).join("")}
    </div>

    <div class="wiz-container">
      ${renderWizard()}
    </div>
  `);
}

function renderWizard() {
  let html = "";
  for (let s = 1; s <= WIZ_STEP; s++) {
    if (s < WIZ_STEP) {
      html += renderWizCollapsed(s);
    } else {
      html += renderWizOpen(s);
    }
  }
  return html;
}

// ------------------------------------------
// COLLAPSED STEP CARDS (With Edit Button)
// ------------------------------------------
function renderWizCollapsed(s) {
  let t = E;
  let title = "", summary = "";

  if (s === 1) {
    title = "Step 1: Title & Banner";
    summary = esc(t.title || "Untitled") + (t.label ? ' · [' + esc(t.label) + ']' : '') + (t.banner ? ' · Banner attached' : ' · No banner');
  } else if (s === 2) {
    title = "Step 2: Exam Category";
    summary = t.exam ? ('Exam: ' + esc(t.exam)) : "Standalone Practice Test (Direct)";
  } else if (s === 3) {
    title = "Step 3: Questions & Hierarchy";
    let hier = pth(t) || "Direct Test Questions";
    summary = t.q.length + " questions added · " + esc(hier);
  } else if (s === 4) {
    title = "Step 4: Access & Pricing";
    summary = t.paid ? ("Paid Test · " + inr(t.sale || t.price) + (t.sale ? " (was " + inr(t.price) + ")" : "")) : "Free Practice Test";
  } else if (s === 5) {
    title = "Step 5: Timer & Marking";
    summary = (t.timer.on ? t.timer.min + " mins" : "Untimed") + " · +" + t.mk + " / -" + (t.neg.on ? t.neg.v : 0);
  } else if (s === 6) {
    title = "Step 6: Leaderboard & Rules";
    summary = "Leaderboard: " + (t.lb ? "ON" : "OFF") + " · Disclaimer: " + (t.dis.on ? "ON" : "OFF");
  }

  return `
    <div class="wiz-collapsed">
      <div class="wiz-col-left">
        <span class="wiz-step-pill">${s}</span>
        <div class="wiz-col-texts">
          <span class="wiz-step-label">${title}</span>
          <span class="wiz-col-summary">${summary}</span>
        </div>
      </div>
      <button class="b o s wiz-edit-btn" onclick="setWizStep(${s})">✏️ Edit</button>
    </div>
  `;
}

// ------------------------------------------
// QUESTION BUILDER & BULK HELPERS
// ------------------------------------------
function qrow(q, i) {
  let tag = [q.subject, q.chapter, q.topic].filter(Boolean).join(" › ");
  return `<div class="qr">
    <span class="qn">${i + 1}</span>
    <div class="bd2">
      <p>${esc(q.t)}</p>
      <small class="mu">Answer: <b>${LT[q.a]}</b> · ${q.o.length} options${q.e ? "" : " · no explanation"}${tag ? ` · <span style="color:var(--ac);font-weight:600;">[${esc(tag)}]</span>` : ""}</small>
      ${rpc(q.id) ? `<a href="#reports" class="st2 pending">${rpc(q.id)} report${rpc(q.id) > 1 ? "s" : ""}</a>` : ""}
      ${q.drop ? '<span class="st2">Not scored</span>' : q.credit ? '<span class="st2 pub">Full marks</span>' : ""}
      ${cf("dq" + i, "Remove question " + (i + 1) + "?", "E.q.splice(" + i + ",1);sv();updateTestInDb(E);")}

function ldF(i) {

const nz = s => s.toLowerCase().replace(/[^a-z0-9\u0900-\u097f]/g, "");

function mk(f, n, o, bad) {
  let op = f.o, ix = LT.slice(0, op.length), a = -1, s = (f.a || "").trim(), m = s.match(/^[\s(]*(?:option\s*)?([A-F1-6])\b/i);
  if (m) {
    let c = m[1].toUpperCase();
    a = /\d/.test(c) ? +c - 1 : LT.indexOf(c);
  }
  if (a < 0 && s) a = op.findIndex(x => nz(x) == nz(s));
  let er = !f.t.trim() ? "question text is empty" : op.filter(x => x.trim()).length < 2 ? "needs at least 2 options" : op.some(x => !x.trim()) ? "an option is empty" : !s ? "ANSWER is missing" : a < 0 || a >= op.length ? "ANSWER '" + s + "' does not match any option" : "";
  if (er) bad.push({ n, m: er });
  else return { id: "q" + rid(), t: f.t.trim(), o: op.map(x => x.trim()), a, e: (f.e || "").trim() };
}

function pTxt(s) {
  let ok = [], bad = [];
  s.replace(/\r/g, "").split(/^(?=[ \t]*QUESTION[ \t]*:)/im).map(b => b.replace(/^[ \t]*Q(?:uestion)?[ \t]*\d+[ \t]*[.):\-]?[ \t]*$/gim, "").trim()).filter(b => /^\s*QUESTION\s*:/i.test(b)).forEach((b, i) => {
    let f = { t: "", o: [], a: "", e: "" }, cur = null, mp = {};
    b.split("\n").forEach(ln => {
      let m = ln.match(/^\s*(QUESTION|ANSWER|EXPLANATION|[A-F])\s*[:.)]\s*(.*)$/i);
      if (m) {
        cur = m[1].toUpperCase();
        let v = m[2];
        if (cur == "QUESTION") f.t = v;
        else if (cur == "ANSWER") f.a = v;
        else if (cur == "EXPLANATION") f.e = v;
        else mp[cur] = v;
      } else if (cur && ln.trim()) {
        let v = ln.trim();
        if (cur == "QUESTION") f.t += "\n" + v;
        else if (cur == "EXPLANATION") f.e += "\n" + v;
        else if (cur != "ANSWER") mp[cur] += " " + v;
      }
    });
    f.o = Object.keys(mp).sort().map(k => mp[k]);
    let q = mk(f, i + 1, 0, bad);
    if (q) ok.push(q);
  });
  if (!ok.length && !bad.length) bad.push({ n: 0, m: "No questions found. Each question must start with a QUESTION: line." });
  return { ok, bad };
}

function pCsv(s) {
  let rows = [], r = [], c = "", q = false;
  s = s.replace(/\r/g, "");
  for (let i = 0; i < s.length; i++) {
    let h = s[i];
    if (q) {
      if (h == '"') {
        if (s[i + 1] == '"') { c += '"'; i++; }
        else q = false;
      } else c += h;
    } else if (h == '"') q = true;
    else if (h == ",") { r.push(c); c = ""; }
    else if (h == "\n") { r.push(c); rows.push(r); r = []; c = ""; }
    else c += h;
  }
  if (c || r.length) { r.push(c); rows.push(r); }
  rows = rows.filter(r => r.some(x => x.trim()));
  let ok = [], bad = [];
  if (!rows.length) return { ok, bad: [{ n: 0, m: "The file is empty." }] };
  let H = rows[0].map(x => x.trim().toLowerCase()), ci = re => H.findIndex(x => re.test(x)), qi = ci(/^(q|question)\b/), ai = ci(/answer|correct|key/), ei = ci(/explan/), oi = [];
  LT.split("").forEach(l => {
    let k = H.findIndex(x => x == l.toLowerCase() || x == "option " + l.toLowerCase() || x == "opt " + l.toLowerCase());
    if (k >= 0) oi.push(k);
  });
  if (qi < 0 || ai < 0 || oi.length < 2) return { ok, bad: [{ n: 0, m: "Header row not found. Use: Question,A,B,C,D,Answer,Explanation" }] };
  rows.slice(1).forEach((r, i) => {
    let q = mk({ t: r[qi] || "", o: oi.map(k => r[k] || ""), a: r[ai] || "", e: ei >= 0 ? r[ei] : "" }, i + 2, 0, bad);
    if (q) ok.push(q);
  });
  return { ok, bad };
}

function chk() {
  let b = BK, r = b.fmt == "csv" ? pCsv(b.raw) : pTxt(b.raw), seen = new Set(E.q.map(q => nz(q.t))), dup = 0, keep = [];
  r.ok.forEach(q => {
    let k = nz(q.t);
    if (seen.has(k)) dup++;
    else { seen.add(k); keep.push(q); }
  });
  b.res = { ok: keep, bad: r.bad, dup };
  render();
  setTimeout(() => {
    let e = $("#bres");
    if (e) e.scrollIntoView({ behavior: "smooth" });
  }, 50);
}

async function publishTestToStudents() {
  let t = E;
  if (!t.title.trim()) { toast("Please set a test title"); setWizStep(1); return; }
  if (t.hasExam && !t.exam) { toast("Please choose an exam"); setWizStep(2); return; }
  if (!t.q.length) { toast("Please add at least 1 question"); setWizStep(3); return; }
  if (t.paid && (!t.price || t.price <= 0)) { toast("Please set a price for paid test"); setWizStep(4); return; }

  t.status = "pub";
  sv();
  toast("Publishing to Student App...");
  await updateTestInDb(t);
  toast("🚀 Test is now LIVE and visible to students!");
  render();
  setTimeout(() => go("tests"), 1200);
}

async function makeTestPrivate() {
  let t = E;
  t.status = "draft";
  sv();
  toast("Making test private...");
  await updateTestInDb(t);
  toast("🔒 Test is now PRIVATE (Hidden from all students)!");
  render();
}

async function saveLiveChanges() {

}

function saveAsDraftAndClose() {
  let t = E;

  toast("📁 Test saved as private draft");
  go("tests");
}

<div class="c2"><h3>Pages students can read</h3><p class="mu">Ready-made text is already filled in. Replace [date], [your city] and the grievance officer name before launch.</p><div class="tabs">${[["priv","Privacy policy"],["terms","Terms & conditions"],["about","About us"],["refund","Refund policy"],["help","Help"]].map(x=>`<button class="${LG==x[0]?"on":""}" onclick="LG='${x[0]}';render()">${x[1]}</button>`).join("")}</div><textarea class="in" rows="14" aria-label="Page text" oninput="D.cfg.legal.${LG}=this.value;sv()">${esc(c.legal[LG]||"")}</textarea><button class="b o s" style="margin-top:8px" onclick="D.cfg.legal[LG]=LEG[LG];sv();render()">Use default text</button></div>
<div class="c2"><h3>Test defaults</h3><p class="mu">Used when you create a new test.</p><div class="g2"><div><label class="l2" for="cmk">Marks per correct</label><input id="cmk" class="in" type="number" step="0.25" value="${c.mk}" oninput="D.cfg.mk=+this.value;sv()"></div><div><label class="l2" for="cng">Negative marking</label><input id="cng" class="in" type="number" step="0.01" value="${c.neg}" oninput="D.cfg.neg=+this.value;sv()"></div></div><label class="l2" for="cds">Default disclaimer before a test</label><textarea id="cds" class="in" rows="7" oninput="D.cfg.dis=this.value;sv()">${esc(c.dis)}</textarea><button class="b o s" style="margin-top:8px" onclick="D.cfg.dis=LEG.dis;sv();render()">Use default text</button></div>
<div class="c2"><h3>Students and leaderboards</h3>${sw(c.hide,"D.cfg.hide=!D.cfg.hide;sv();render()","Hide all leaderboards","Overrides every test")}${sw(c.signup,"D.cfg.signup=!D.cfg.signup;sv();render()","Allow new sign-ups")}${sw(c.maint,"D.cfg.maint=!D.cfg.maint;updateMaintenanceInDb(D.cfg.maint,D.cfg.mmsg);sv();render()","Maintenance mode","Students see a message instead of the app")}${c.maint?f("mmsg","Maintenance message"):""}</div>
<div style="margin-bottom:16px"><button class="b big" style="width:100%" onclick="saveConfigToDb()">${ic("check")}Save all settings to Supabase</button></div>
<div class="c2"><h3>Razorpay payments</h3><p class="mu">UPI, cards, net banking and wallets all come through Razorpay Checkout.</p><div class="seg wide ${c.rzm=="live"?"r":""}" style="margin:10px 0"><button class="${c.rzm!="live"?"on":""}" onclick="setRz('test')">Test mode</button><button class="${c.rzm=="live"?"on":""}" onclick="setRz('live')">Live mode</button></div>${f("rz","Key ID")}<label class="l2" for="crs">Key Secret</label><input id="crs" class="in" type="password" autocomplete="off" placeholder="Saved on the server only"><label class="l2" for="crw">Webhook secret</label><input id="crw" class="in" type="password" autocomplete="off" placeholder="Saved on the server only"><p class="hint">The secrets are never kept in the browser. In the live app they are sent once to a secure server function. Use Test mode until you have tried a full payment.</p></div>`)}
function upLogo(i){let f=i.files[0];if(!f)return;if(f.size>2e5){toast("Logo must be under 200 KB");return}let r=new FileReader();r.onload=()=>{D.cfg.logo=r.result;sv();render()};r.readAsDataURL(f)}
function setLb(v){E.label=v;sv();updateTestInDb(E);render()}
function setNg(v){if(v=="c")E.neg.cu=true;else{E.neg.cu=false;E.neg.v=+v}sv();render()}
function setRes(v){E.res=v;sv();render()}
function setAS(v){AS=v;go("dash");render()}
function setRole(v){SN.role=v;SN.p=[...RL[v].p];render()}
function setRSN(v){RSN=v;render()}
function setScope(v){CP.scope=v;render()}
function setRz(v){D.cfg.rzm=v;sv();render()}
function setAct(v){RS[RX].act=v;render()}
function setAns(v){RS[RX].ans=+v;render()}
function fq(id) {
  for (const t of D.tests) {
    let i = t.q.findIndex(q => q.id == id);
    if (i >= 0) return { t, q: t.q[i], i };
    if (String(id).startsWith('q_' + t.id + '_')) {
      let idx = parseInt(id.replace('q_' + t.id + '_', ''), 10);
      if (t.q && t.q[idx]) return { t, q: t.q[idx], i: idx };
    }
  }
  return null;
}
function openQ(ti,i){ST=1;QM="manual";QX="all";KP=1;go("edit-"+ti);QE=i;QF=JSON.parse(JSON.stringify(tid(ti).q[i]))}
function rpan(k,f){let s=RS[k];return `<div class="c2" style="background:var(--hi);box-shadow:none;margin:12px 0 0"><h3>What do you want to do?</h3>${rr([["dismiss","The answer key is correct","No change. The reports are closed."],["fix","I will edit the question","Fix the wording or options. Reports close when you save."],["rescore","The answer key was wrong","Change the correct answer. Every student’s score is re-calculated."],["credit","Give full marks to everyone","Use this when the question was flawed."],["drop","Remove it from scoring","Totals are calculated without this question."]],s.act,"setAct")}${s.act=="rescore"?`<label class="l2">New correct answer</label>${chips(f.q.o.map((o,i)=>[i,LT[i]+". "+(o.length>16?o.slice(0,16)+"…":o)]),s.ans,"setAns")}`:""}${s.act!="fix"?sw(s.notify,"RS[RX].notify=!RS[RX].notify;render()","Thank the students who reported","They get a short message"):""}<div class="rowx" style="margin-top:12px"><button class="b o" onclick="RX='';render()">Cancel</button>${s.act=="fix"?`<button class="b" onclick="openQ('${f.t.id}',${f.i})">Open the question</button>`:`<button class="b" onclick="applyR()">Apply</button>`}</div></div>`}
function applyR(){let k=RX,s=RS[k],f=fq(k);if(!f)return;let q=f.q,txt="Answer key confirmed";if(s.act=="rescore"){q.a=s.ans;delete q.drop;delete q.credit;txt="Answer changed to "+LT[s.ans]+". "+f.t.at+" attempts re-scored"}else if(s.act=="credit"){q.credit=true;txt="Full marks given to everyone"}else if(s.act=="drop"){q.drop=true;txt="Removed from scoring"}D.reports.forEach(r=>{if(r.qid==k&&r.st=="open"){r.st=s.act=="dismiss"?"dismissed":"resolved";r.res=txt}});resolveReportInDb(k, s.act, txt);RX="";sv();toast(txt);render()}
function reports(){let L=D.reports.filter(r=>RT=="open"?r.st=="open":r.st!="open"),g={};L.forEach(r=>(g[r.qid]=g[r.qid]||[]).push(r));let ks=Object.keys(g).sort((a,b)=>g[b].length-g[a].length);
lay("reports","Question reports",`<p class="mu" style="margin-top:-8px">Students tap “Report an issue” while reviewing a result. Check each one and decide what to do.</p><div class="tabs"><button class="${RT=="open"?"on":""}" onclick="RT='open';RX='';render()">Open (${D.reports.filter(r=>r.st=="open").length})</button><button class="${RT!="open"?"on":""}" onclick="RT='done';RX='';render()">Resolved</button></div>${ks.map(k=>{let f=fq(k),rs=g[k];if(!f)return"";let cn={};rs.forEach(r=>cn[r.reason]=(cn[r.reason]||0)+1);return `<div class="c2"><div class="rowx"><div>${idb(f.t.id)} <b>${esc(f.t.title)}</b></div><span class="st2 pending">${rs.length} report${rs.length>1?"s":""}</span></div><p style="margin:12px 0 6px"><b>Q${f.i+1}.</b> ${esc(f.q.t)}</p><small class="mu">Answer key: <b>${LT[f.q.a]}</b>. ${esc(f.q.o[f.q.a])}</small><div class="tabs wrap" style="margin:10px 0 4px">${Object.entries(cn).map(c=>`<span class="chip">${esc(c[0])} × ${c[1]}</span>`).join("")}</div>${rs.filter(r=>r.note).slice(0,3).map(r=>`<div class="hint">“${esc(r.note)}” · ${esc(r.stu)}</div>`).join("")}${RT=="open"?(RX==k?rpan(k,f):`<button class="b" style="margin-top:12px" onclick="RX='${k}';RS['${k}']={act:'dismiss',ans:${f.q.a},notify:true};render()">Review</button>`):`<div class="hint okc">Resolved: ${esc(rs[0].res||"")}</div>`}</div>`}).join("")||'<div class="em">Nothing here. Student reports will appear in this list.</div>'}`)}
function seedRep(){return [];}
function migrate(){
  D.cfg.legal=Object.assign({priv:"",terms:"",about:"",refund:"",help:""},D.cfg.legal||{});
  ["priv","terms","about","refund","help"].forEach(k=>{if(!D.cfg.legal[k])D.cfg.legal[k]=LEG[k]});
  let od=s=>(s||"").startsWith("This test is for practice.");
  if(!D.cfg.dis||od(D.cfg.dis))D.cfg.dis=LEG.dis;
  delete D.cfg.fb;
  D.cfg.rzm=D.cfg.rzm||"test";
  D.cfg.rzs=D.cfg.rzs||"";
  D.cfg.rzw=D.cfg.rzw||"";
  D.tests.forEach(t=>{t.q.forEach((q,i)=>{if(!q.id)q.id="q"+rid()+i;delete q.rv});if(t.dis&&od(t.dis.txt))t.dis.txt=LEG.dis});
  D.orders=(D.orders||[]).filter(o=>!['O1001','O1002','O1003'].includes(o.id)&&!['Aarav K.','Priya S.','Rohit M.','Sneha P.','Vikash R.','Anjali D.','Md. Faiz','Kiran T.'].includes(o.stu));
  D.students=(D.students||[]).filter(s=>!s.e.endsWith('@example.com'));
  D.coupons=(D.coupons||[]).filter(c=>!['STAR10','FLAT50'].includes(c.code));
  D.staff=(D.staff||[]).filter(s=>!['rajesh@','priya@','amit@'].some(x=>s.e.startsWith(x)));
  D.exams=(D.exams||[]).filter(x=>!['BSEB Class 10','BPSC AEDO','CTET Paper 1'].includes(x));
  if(!Array.isArray(D.reports))D.reports=[];
}
function render(){let y=scrollY;render0();if(Math.abs(scrollY-y)>1)scrollTo(0,y)}
function render0(){let p=(location.hash.slice(1)||"dash").split("-"),k=({edit:"tests",reports:"tests"})[p[0]]||p[0];if(!can(k)){let f=NAV.find(n=>can(n[3]));if(f&&location.hash!="#"+f[0])return go(f[0]);if(!f)return lay("","No access",'<div class="em">This role has no access yet.</div>')}
({dash,tests,reports,pricing,students,banners,staff,settings,edit:()=>edit(p[1])}[p[0]]||dash)();if(p[0]=="dash")document.querySelectorAll(".kp b").forEach(e=>{let m=e.textContent.match(/^(₹?)([\d,]+)$/);if(!m)return;let n=+m[2].replace(/,/g,""),t0=performance.now();(function f(t){let k=Math.min(1,(t-t0)/700);e.textContent=m[1]+Math.round(n*k).toLocaleString("en-IN");if(k<1)requestAnimationFrame(f)})(t0)})}
let CUR="",HS=[],SY={};try{history.scrollRestoration="manual"}catch(e){}
addEventListener("scroll",()=>{SY[CUR]=scrollY},{passive:true});

addEventListener("hashchange",route);route();
