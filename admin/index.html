// ==========================================
// HIERARCHY-DRIVEN TEST CREATION SYSTEM (MATCHING FLOWCHART & 5-SCREEN MOCKUP)
// Screen 1: Create Test - Basic Details
// Screen 2: Subject Added (+ Add Chapter OR Upload Questions)
// Screen 3: Chapter Added (in Subject) (+ Add Topic OR Upload Questions)
// Screen 4: Topic Added (in Chapter) (Upload Questions)
// Screen 5: Question Creation / Upload (Manual / Bulk, Save & Add Another)
// Screen 6: Settings & Review (Single Publish / Make Private)
// ==========================================

let HIER_VIEW = {
  screen: 'details', // 'details' | 'subjects' | 'chapters' | 'topics' | 'questions' | 'settings' | 'review'
  subIdx: -1,
  chIdx: -1,
  tpIdx: -1,
  qTab: 'manual'     // 'manual' | 'bulk'
};

function initHierarchyTree(t) {
  if (!t.hierarchy_tree) t.hierarchy_tree = [];
  if (t.sub && t.sub.on && t.sub.v && !t.hierarchy_tree.some(s => s.name === t.sub.v)) {
    t.hierarchy_tree.push({ name: t.sub.v, ch_on: !!(t.ch && t.ch.on), chapters: [] });
  }
  (t.q || []).forEach(q => {
    let s = (q.subject || '').trim();
    let c = (q.chapter || '').trim();
    let p = (q.topic || '').trim();
    if (s) {
      t.sub.on = true;
      let sObj = t.hierarchy_tree.find(x => x.name.toLowerCase() === s.toLowerCase());
      if (!sObj) {
        sObj = { name: s, ch_on: !!c, chapters: [] };
        t.hierarchy_tree.push(sObj);
      }
      if (c) {
        sObj.ch_on = true;
        let cObj = sObj.chapters.find(x => x.name.toLowerCase() === c.toLowerCase());
        if (!cObj) {
          cObj = { name: c, tp_on: !!p, topics: [] };
          sObj.chapters.push(cObj);
        }
        if (p && !cObj.topics.some(tp => (typeof tp === 'string' ? tp : tp.name).toLowerCase() === p.toLowerCase())) {
          cObj.tp_on = true;
          cObj.topics.push(p);
        }
      }
    }
  });
}

function syncTestHierarchyFields(t) {
  if (t.hierarchy_tree && t.hierarchy_tree.length > 0) {
    t.sub.on = true;
    t.sub.v = t.hierarchy_tree[0].name;
    let firstCh = t.hierarchy_tree[0].chapters && t.hierarchy_tree[0].chapters[0];
    if (firstCh) {
      t.ch.on = true;
      t.ch.v = firstCh.name;
      let firstTp = firstCh.topics && firstCh.topics[0];
      if (firstTp) { t.tp.on = true; t.tp.v = typeof firstTp === 'string' ? firstTp : firstTp.name; }
      else { t.tp.on = false; t.tp.v = ''; }
    } else { t.ch.on = false; t.ch.v = ''; t.tp.on = false; t.tp.v = ''; }
  } else if (!t.sub?.on) {
    t.sub.on = false; t.sub.v = '';
    t.ch.on = false; t.ch.v = '';
    t.tp.on = false; t.tp.v = '';
  }
}

function edit(i) {
  let t = tid(i);
  if (!t) return go("tests");
  E = t;
  initHierarchyTree(t);

  // If newly created or fresh, start on details
  if (t._fresh) {
    HIER_VIEW.screen = 'details';
    HIER_VIEW.subIdx = -1;
    HIER_VIEW.chIdx = -1;
    HIER_VIEW.tpIdx = -1;
    delete t._fresh;
  }

  let isLive = t.status === "pub";

  let isHierarchyActive = ['subjects', 'chapters', 'topics', 'questions'].includes(HIER_VIEW.screen);

  lay("tests", esc(t.title) || "Test Editor", `

  if (HIER_VIEW.screen === 'details') return renderScreen1_Details();

        </div>
        <div>
          <label class="l2" style="margin-top:0;">Negative Marking (-)</label>
          <input class="in" type="number" min="0" step="0.01" value="${t.neg?.v||0.33}" oninput="E.neg.v=+this.value;E.neg.on=+this.value>0;sv()">
        </div>
      </div>

      <div class="g2" style="margin-top:12px;">
        <div>
          <label class="l2" style="margin-top:0;">Card Badge / Tag</label>
          ${chips([["","None"],["New","New"],["Popular","Popular"],["Bestseller","Bestseller"],["Free","Free"]], t.label, "setLb")}
        </div>
        <div>
          <label class="l2" style="margin-top:0;">Access</label>
          <div class="seg ${t.paid ? 'r' : ''}">
            <button class="${!t.paid?'on':''}" type="button" onclick="E.paid=false;sv();render();">Free</button>
            <button class="${t.paid?'on':''}" type="button" onclick="E.paid=true;sv();render();">${ic("lock")} Paid</button>
          </div>
          ${t.paid ? `
            <div style="display:flex; gap:8px; margin-top:8px;">
              <input class="in" type="number" placeholder="Price (₹)" value="${t.price||''}" oninput="E.price=+this.value;sv()">

      <div style="margin-top:18px; padding:16px; background:var(--hi); border:1.5px solid var(--br); border-radius:14px;">

      </div>

      <div class="rowx" style="margin-top:22px;">
        <span class="mu" style="font-size:0.85rem;">Draft saved automatically</span>
        <button class="b" type="button" onclick="saveDetailsAndNext()">
          ${isSubjectOn ? "Next: Add Subjects →" : "Next: Add Questions →"}
        </button>
      </div>
    </div>
  `;
}

function toggleSubjectMode() {
  initHierarchyTree(E);
  if (!E.sub) E.sub = { on: false, v: '' };

  if (E.sub.on) {
    if (E.hierarchy_tree && E.hierarchy_tree.length > 0) {
      if (!confirm("Disable subjects? Existing subjects and chapters will be cleared from this test.")) {
        return;
      }
    }
    E.sub.on = false;
    E.sub.v = '';
    E.hierarchy_tree = [];
    E.q.forEach(q => { q.subject = ''; q.chapter = ''; q.topic = ''; });
    syncTestHierarchyFields(E);
  } else {
    E.sub.on = true;
    if (!E.hierarchy_tree) E.hierarchy_tree = [];
  }
  sv();
  updateTestInDb(E);
  render();
}

function saveDetailsAndNext() {
  if (!E.title.trim()) { toast("Please enter a test title"); return; }
  sv();
  updateTestInDb(E);
  if (E.sub?.on) {
    HIER_VIEW.screen = 'subjects';
    HIER_VIEW.subIdx = -1;
    HIER_VIEW.chIdx = -1;
    HIER_VIEW.tpIdx = -1;
  } else {
    HIER_VIEW.screen = 'questions';
    HIER_VIEW.subIdx = -1;
    HIER_VIEW.chIdx = -1;
    HIER_VIEW.tpIdx = -1;
  }
  render();
  scrollTo(0, 0);
}

function confirmAddSubject() {

    E.sub.on = true;
    syncTestHierarchyFields(E);
    sv();
    updateTestInDb(E);
    toast("Subject added: " + val);
    render();
  } else {
    toast("Subject already exists");
  }
}

function renameSubject(sIdx) {
  let sub = E.hierarchy_tree[sIdx];
  let newName = prompt("Rename subject:", sub.name);
  if (newName && newName.trim() && newName.trim() !== sub.name) {
    let oldName = sub.name;
    sub.name = newName.trim();
    // Update all questions that had oldName
    E.q.forEach(q => { if (q.subject === oldName) q.subject = sub.name; });
    syncTestHierarchyFields(E);
    sv();
    updateTestInDb(E);
    render();
  }
}

function deleteSubject(sIdx) {
  let sub = E.hierarchy_tree[sIdx];
  if (!confirm("Delete subject '" + sub.name + "'? Questions under this subject will be removed.")) return;
  E.q = E.q.filter(q => q.subject !== sub.name);
  E.hierarchy_tree.splice(sIdx, 1);
  syncTestHierarchyFields(E);
  sv();
  updateTestInDb(E);
  toast("Subject removed");
  render();
}

  HIER_VIEW.tpIdx = pIdx;

  let subName = sIdx >= 0 ? E.hierarchy_tree[sIdx]?.name : '';
  let chName = (sIdx >= 0 && cIdx >= 0) ? E.hierarchy_tree[sIdx]?.chapters?.[cIdx]?.name : '';
  let tpName = '';
  if (sIdx >= 0 && cIdx >= 0 && pIdx >= 0) {
    let raw = E.hierarchy_tree[sIdx]?.chapters?.[cIdx]?.topics?.[pIdx];
    tpName = typeof raw === 'string' ? raw : (raw?.name || '');
  }

  // Set target for new questions
  Q_TARGET = { sub: subName || '', ch: chName || '', tp: tpName || '' };
  QE = -2; // fresh manual question ready
  QF = { id: "q" + rid(), t: "", o: ["", "", "", ""], a: 0, e: "", subject: subName, chapter: chName, topic: tpName };

  render();
  scrollTo(0, 0);
}

function goBackFromQuestions() {
  if (HIER_VIEW.tpIdx >= 0) {
    HIER_VIEW.screen = 'topics';
  } else if (HIER_VIEW.chIdx >= 0) {
    HIER_VIEW.screen = 'chapters';
  } else if (HIER_VIEW.subIdx >= 0) {
    HIER_VIEW.screen = 'subjects';
  } else if (E.sub?.on) {
    HIER_VIEW.screen = 'subjects';
  } else {
    HIER_VIEW.screen = 'details';
  }
  render();
  scrollTo(0, 0);
}

function renderScreen5_Questions() {
  let t = E;
  let sub = HIER_VIEW.subIdx >= 0 ? t.hierarchy_tree[HIER_VIEW.subIdx] : null;
  let ch = (sub && HIER_VIEW.chIdx >= 0) ? sub.chapters[HIER_VIEW.chIdx] : null;
  let tpName = '';
  if (ch && HIER_VIEW.tpIdx >= 0) {
    let raw = ch.topics[HIER_VIEW.tpIdx];
    tpName = typeof raw === 'string' ? raw : (raw?.name || '');
  }

  let breadcrumbs = [];
  if (sub) breadcrumbs.push(sub.name);
  if (ch) breadcrumbs.push(ch.name);
  if (tpName) breadcrumbs.push(tpName);
  let contextLabel = breadcrumbs.length ? breadcrumbs.join(' › ') : 'Direct Test Questions';

  // Filter questions that belong to this exact context
  let contextQuestions = t.q.filter(q => {
    let qSub = (q.subject || '').trim();
    let qCh = (q.chapter || '').trim();
    let qTp = (q.topic || '').trim();

    if (!breadcrumbs.length) {
      return !qSub && !qCh && !qTp;
    }
    if (tpName) {
      return qSub === sub.name && qCh === ch.name && qTp === tpName;
    }
    if (ch) {
      return qSub === sub.name && qCh === ch.name && !qTp;
    }
    if (sub) {
      return qSub === sub.name && !qCh && !qTp;
    }
    return true;
  });

  return `
    <div class="c2">
      <!-- Breadcrumb Header -->
      <div class="rowx" style="margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--br);">
        <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
          <a class="bkb" style="margin:0;" href="javascript:void(0)" onclick="goBackFromQuestions()">${ic("back")} <span>Back</span></a>
          <span style="color:var(--mu);">›</span>
          <b style="font-size:1.1rem;">Questions in:</b>
          <span class="chip g" style="font-weight:700;">${esc(contextLabel)}</span>
        </div>
        <span class="chip">${contextQuestions.length} Questions</span>
      </div>

      <!-- Tabs: Create Manually | Upload (Excel/Text) -->
      <div class="tabs" style="margin-bottom:16px;">
        <button class="${HIER_VIEW.qTab==='manual'?'on':''}" type="button" onclick="HIER_VIEW.qTab='manual';render();">Create Manually</button>
        <button class="${HIER_VIEW.qTab==='bulk'?'on':''}" type="button" onclick="HIER_VIEW.qTab='bulk';render();">Upload (Excel / Text)</button>
      </div>

      ${HIER_VIEW.qTab === 'bulk' ? bulk() : renderManualQuestionCard(contextLabel)}

      <!-- Existing Questions List for this Context -->
      <div style="margin-top:24px; padding-top:16px; border-top:1.5px solid var(--br);">
        <div class="rowx" style="margin-bottom:12px;">
          <b style="font-size:1.05rem;">Questions in ${esc(contextLabel)} (${contextQuestions.length})</b>
          <small class="mu">Total in Test: ${t.q.length}</small>
        </div>
        <div style="display:flex; flex-direction:column; gap:8px;">
          ${contextQuestions.map((q, i) => {
            let globalIdx = t.q.indexOf(q);
            return QE === globalIdx ? '' : qrow(q, globalIdx);
          }).join("") || `
            <div class="em" style="padding:20px; border:1px dashed var(--br); border-radius:12px;">
              No questions added in this level yet. Use the form above to add your first question!
            </div>
          `}
        </div>
      </div>

      <!-- Navigation -->
      <div class="rowx" style="margin-top:26px;">
        <button class="b o" type="button" onclick="goBackFromQuestions()">← Back</button>
        <button class="b" type="button" onclick="HIER_VIEW.screen='review';render();">Review & Publish →</button>
      </div>
    </div>
  `;
}

function renderManualQuestionCard(contextLabel) {
  let q = QF || { id: "q" + rid(), t: "", o: ["", "", "", ""], a: 0, e: "" };

  return `
    <div class="c2" style="background:var(--hi); border:1.5px solid var(--ac); border-radius:16px; padding:18px; margin-bottom:16px;">
      <div class="rowx" style="margin-bottom:12px;">
        <b style="color:var(--ac); font-size:1.05rem;">${QE === -2 ? "Add Question" : "Edit Question"}</b>
        <span class="chip g">${esc(contextLabel)}</span>
      </div>

      <div class="g2" style="margin-bottom:10px;">
        <div>
          <label class="l2" style="margin-top:0;">Question Type</label>
          <select class="in" disabled style="opacity:0.8;">
            <option>MCQ (Single Correct Option)</option>
          </select>
        </div>
      </div>

      <label class="l2" for="qt" style="margin-top:0;">Question Text *</label>
      <textarea id="qt" class="in" rows="4" placeholder="Type or paste question text here..." oninput="QF.t=this.value">${esc(q.t)}</textarea>

      <label class="l2" style="margin-top:14px;">Options (Tap radio button to mark correct answer) *</label>
      ${q.o.map((o, j) => `
        <div class="of" style="margin-bottom:8px;">
          <button class="rd${q.a == j ? " on" : ""}" type="button" aria-label="Option ${LT[j]} is correct" onclick="QF.a=${j};render()">${q.a == j ? ic("check") : ""}</button>
          <span class="lt">${LT[j]}</span>
          <input class="in" aria-label="Option ${LT[j]}" placeholder="Option ${LT[j]} text..." value="${esc(o)}" oninput="QF.o[${j}]=this.value">
          ${q.o.length > 2 ? `<button class="ib2" type="button" aria-label="Remove option" onclick="rmO(${j})">${ic("x")}</button>` : ""}
        </div>
      `).join("")}

      ${q.o.length < 6 ? `
        <button class="b o s" type="button" style="margin-top:4px;" onclick="QF.o.push('');render();">${ic("plus")} Add Option</button>
      ` : ""}

      <div style="margin-top:14px;">
        <label class="l2" for="qe" style="margin-top:0;">Explanation (optional - shown after test)</label>
        <textarea id="qe" class="in" rows="2" placeholder="Explain why the answer is correct..." oninput="QF.e=this.value">${esc(q.e)}</textarea>
      </div>

      <div class="rowx" style="margin-top:16px;">
        <span class="hint bad" id="qer"></span>
        <div style="display:flex; gap:10px;">
          ${QE >= 0 ? `
            <button class="b o" type="button" onclick="cancelEditQ()">Cancel</button>
            <button class="b" type="button" onclick="saveQuestionItem(false)">Update Question</button>
          ` : `
            <button class="b o" type="button" onclick="saveQuestionItem(false)">Save Question</button>
            <button class="b" type="button" onclick="saveQuestionItem(true)">Save & Add Another</button>
          `}
        </div>
      </div>
    </div>
  `;
}

function cancelEditQ() {
  QE = -2;
  let subName = HIER_VIEW.subIdx >= 0 ? E.hierarchy_tree[HIER_VIEW.subIdx]?.name : '';
  let chName = (HIER_VIEW.subIdx >= 0 && HIER_VIEW.chIdx >= 0) ? E.hierarchy_tree[HIER_VIEW.subIdx]?.chapters?.[HIER_VIEW.chIdx]?.name : '';
  let tpName = '';
  if (HIER_VIEW.subIdx >= 0 && HIER_VIEW.chIdx >= 0 && HIER_VIEW.tpIdx >= 0) {
    let raw = E.hierarchy_tree[HIER_VIEW.subIdx]?.chapters?.[HIER_VIEW.chIdx]?.topics?.[HIER_VIEW.tpIdx];
    tpName = typeof raw === 'string' ? raw : (raw?.name || '');
  }
  QF = { id: "q" + rid(), t: "", o: ["", "", "", ""], a: 0, e: "", subject: subName, chapter: chName, topic: tpName };
  render();
}

function saveQuestionItem(addAnother) {
  let q = QF;
  let er = !q.t.trim() ? "Write the question text." : q.o.filter(x => x.trim()).length < 2 ? "Add at least two options." : !q.o[q.a]?.trim() ? "The marked correct option is empty." : "";
  if (er) {
    let errEl = $("#qer");
    if (errEl) errEl.textContent = er;
    toast(er);
    return;
  }

  q.o = q.o.map(x => x.trim());
  q.t = q.t.trim();
  q.e = (q.e || "").trim();

  // Attach target context
  if (Q_TARGET) {
    if (Q_TARGET.sub) q.subject = Q_TARGET.sub;
    if (Q_TARGET.ch) q.chapter = Q_TARGET.ch;
    if (Q_TARGET.tp) q.topic = Q_TARGET.tp;
  }

  if (QE === -2) {
    q.id = "q" + rid();
    E.q.push(q);
    toast("Question saved!");
  } else if (QE >= 0) {
    E.q[QE] = q;
    toast("Question updated!");
  }

  saveQuestionToDb(q, E?.id);
  sv();
  updateTestInDb(E);

  if (addAnother) {
    QE = -2;
    QF = {
      id: "q" + rid(),
      t: "",
      o: ["", "", "", ""],
      a: 0,
      e: "",
      subject: Q_TARGET.sub || "",
      chapter: Q_TARGET.ch || "",
      topic: Q_TARGET.tp || ""
    };
    render();
    setTimeout(() => {
      let el = $("#qt");
      if (el) el.focus();
    }, 50);
  } else {
    QE = -2;
    QF = {
      id: "q" + rid(),
      t: "",
      o: ["", "", "", ""],
      a: 0,
      e: "",
      subject: Q_TARGET.sub || "",
      chapter: Q_TARGET.ch || "",
      topic: Q_TARGET.tp || ""
    };
    render();
  }
}

function editQuestionItem(globalIdx) {
  if (!E || !E.q || !E.q[globalIdx]) return;
  QE = globalIdx;
  QF = JSON.parse(JSON.stringify(E.q[globalIdx]));
  render();
  setTimeout(() => {
    let el = $("#qt");
    if (el) el.focus();
  }, 50);
}

function deleteQuestionItem(globalIdx) {
  if (!E || !E.q || !E.q[globalIdx]) return;
  if (!confirm("Are you sure you want to delete this question?")) return;
  let removed = E.q.splice(globalIdx, 1);
  if (removed && removed[0] && removed[0].id) {
    deleteQuestionFromDb(removed[0].id, E.id);
  }
  sv();
  updateTestInDb(E);
  if (QE === globalIdx) {
    cancelEditQ();
  } else {
    render();
  }
  toast("Question deleted");
}

function qrow(q, globalIdx) {
  let displayNum = (globalIdx >= 0 ? globalIdx + 1 : 1);
  return `
    <div class="c2" style="background:var(--bg); border:1px solid var(--br); border-radius:12px; padding:14px; margin-bottom:8px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
        <div style="flex:1;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;">
            <span class="tg" style="font-weight:700; background:var(--hi);">Q${displayNum}</span>
            ${q.subject ? `<span class="tg" style="background:rgba(59,130,246,0.1); color:#2563eb; font-weight:600;">${esc(q.subject)}</span>` : ''}
            ${q.chapter ? `<span class="tg" style="background:rgba(16,185,129,0.1); color:#059669;">${esc(q.chapter)}</span>` : ''}
            ${q.topic ? `<span class="tg" style="background:rgba(139,92,246,0.1); color:#7c3aed;">${esc(q.topic)}</span>` : ''}
          </div>
          <div style="font-weight:600; font-size:0.95rem; margin-bottom:8px; line-height:1.4;">${esc(q.t)}</div>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:0.85rem;">
            ${(q.o || []).map((opt, oIdx) => `
              <div style="padding:4px 8px; border-radius:6px; background:${oIdx === q.a ? 'rgba(34,197,94,0.12)' : 'var(--hi)'}; border:1px solid ${oIdx === q.a ? '#22c55e' : 'var(--br)'}; color:${oIdx === q.a ? '#15803d' : 'inherit'}; font-weight:${oIdx === q.a ? '600' : 'normal'};">
                <b>${String.fromCharCode(65 + oIdx)}.</b> ${esc(opt)} ${oIdx === q.a ? '✓' : ''}
              </div>
            `).join('')}
          </div>
          ${q.e ? `<div class="mu" style="margin-top:6px; font-size:0.8rem;"><b>Explanation:</b> ${esc(q.e)}</div>` : ''}
        </div>
        <div style="display:flex; gap:6px;">
          <button class="b o s" type="button" onclick="editQuestionItem(${globalIdx})" title="Edit">${ic("edit") || "Edit"}</button>
          <button class="b o s" type="button" style="color:#ef4444; border-color:rgba(239,68,68,0.3);" onclick="deleteQuestionItem(${globalIdx})" title="Delete">${ic("trash") || "Delete"}</button>
        </div>
      </div>
    </div>
  `;
}

// SCREEN 6: SETTINGS (Timer, Marking, Rules)
// ==========================================

  let cu = ng.cu || ![.25, .33, .5, 1].includes(ng.v);

  return `
    <div class="c2">
      <div class="wiz-step-header">
        <span class="wiz-active-pill">3</span>
        <div>
          <h3 style="margin:0;">Test Settings & Rules</h3>
          <small class="mu">Configure timer behavior, negative deduction, leaderboard, and display rules.</small>
        </div>
      </div>

      <!-- Timer -->
      <div style="margin-top:14px;">
        ${sw(t.timer.on, "E.timer.on=!E.timer.on;sv();render()", "Enable Timer", "Auto-submits test when time ends")}

      ${sw(t.shufO, "E.shufO=!E.shufO;sv();render()", "Shuffle Options", "Randomize options A/B/C/D order")}

        ${t.dis.on ? `
          <div style="margin:8px 0 14px;">
            <textarea class="in" rows="4" placeholder="Instructions or disclaimer..." oninput="E.dis.txt=this.value;sv()">${esc(t.dis.txt)}</textarea>
            <button class="b o s" type="button" style="margin-top:6px;" onclick="E.dis.txt=D.cfg.dis;sv();render()">Use Default Template</button>
          </div>
        ` : ""}
      </div>

      <div class="rowx" style="margin-top:24px;">
        <button class="b o" type="button" onclick="goToQuestionsOrHierarchy()">← Back: Hierarchy</button>
        <button class="b" type="button" onclick="HIER_VIEW.screen='review';render();">Next: Review & Publish →</button>
      </div>

// SCREEN 7: REVIEW & PUBLISH (Clean Single Action)
// ==========================================
function renderScreen7_Review() {
  let t = E;
  let isLive = t.status === "pub";

  let ck = [
    [!!t.title.trim(), "Title: " + esc(t.title || "Missing title"), 'details'],
    [t.q.length > 0, t.q.length + " question" + (t.q.length !== 1 ? "s" : "") + " created", 'questions'],

  return `
    <div class="c2">
      <div class="wiz-step-header">

          <small class="mu">Check test summary and readiness before making it live to students.</small>
        </div>
      </div>

      ${isLive ? `
        <div style="background:rgba(34,197,94,0.12); border:1.5px solid #16a34a; color:#16a34a; padding:16px 18px; border-radius:14px; margin-bottom:16px; display:flex; align-items:center; gap:12px;">
          <span style="font-size:1.6rem;">🟢</span>
          <div style="flex:1;">
            <b style="font-size:1.05rem;">THIS TEST IS LIVE ON THE STUDENT APP</b>
            <p style="margin:2px 0 0; font-size:0.86rem; color:#166534;">Students can search, attempt, and view results for this test.</p>
          </div>
          <button class="b dg s" type="button" onclick="makeTestPrivate()">🔒 Make Private</button>
        </div>
      ` : `
        <div style="background:rgba(234,179,8,0.12); border:1.5px solid #ca8a04; color:#ca8a04; padding:16px 18px; border-radius:14px; margin-bottom:16px; display:flex; align-items:center; gap:12px;">
          <span style="font-size:1.6rem;">🔒</span>
          <div style="flex:1;">
            <b style="font-size:1.05rem;">THIS TEST IS PRIVATE (DRAFT)</b>
            <p style="margin:2px 0 0; font-size:0.86rem; color:#854d0e;">This test is hidden from students until you publish it.</p>
          </div>
          <button class="b s" type="button" onclick="publishTestToStudents()">🚀 Publish to Students</button>

      `}

        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">

        </div>

        <div class="g3" style="margin-top:14px; padding-top:12px; border-top:1px solid var(--br);">
          <div><small class="mu">Total Questions</small><b style="display:block;">${t.q.length} Questions</b></div>
          <div><small class="mu">Subjects</small><b style="display:block;">${(t.hierarchy_tree||[]).length} Subject(s)</b></div>
          <div><small class="mu">Duration</small><b style="display:block;">${t.timer.on ? t.timer.min+" mins" : "Untimed"}</b></div>
          <div><small class="mu">Marking</small><b style="display:block;">+${t.mk} / -${t.neg.on ? t.neg.v : 0}</b></div>

      <!-- Single Action Buttons -->

          <button class="b" type="button" onclick="publishTestToStudents()">🚀 Publish to Students Now</button>
        `}
      </div>

  `;
}

async function publishTestToStudents() {
  let t = E;
  if (!t.title.trim()) { toast("Please set a test title"); HIER_VIEW.screen='details'; render(); return; }
  if (!t.q.length) { toast("Please add at least 1 question"); goToQuestionsOrHierarchy(); return; }
  if (t.paid && (!t.price || t.price <= 0)) { toast("Please set a price for paid test"); HIER_VIEW.screen='details'; render(); return; }

  t.status = "pub";
  sv();
  toast("Publishing to Student App...");
  await updateTestInDb(t);
  toast("🚀 Test is now LIVE and visible to students!");
  render();
  setTimeout(() => go("tests"), 1200);
}

async function makeTestPrivate() {
  E.status = "draft";
  sv();
