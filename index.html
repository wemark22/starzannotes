<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StarzanNotes - Portal</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #f6f4ee;
      --sf: #ffffff;
      --tx: #17211f;
      --mu: #5d6966;
      --ac: #0f6b5c;
      --hi: #edf3ef;
      --br: #e3dfd3;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: Inter, system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: var(--sf);
      border: 1px solid var(--br);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 14px 34px -16px rgba(23, 33, 31, 0.2);
    }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-size: 2.2rem;
      margin: 0 0 8px;
    }
    p {
      color: var(--mu);
      margin: 0 0 28px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1.05rem;
      transition: transform 0.15s, filter 0.15s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-student {
      background: var(--ac);
      color: #fff;
    }
    .btn-student:hover { filter: brightness(1.1); }
    .btn-admin {
      background: var(--hi);
      color: var(--ac);
      border: 1.5px solid var(--ac);
    }
    .btn-admin:hover { background: #e0ece6; }
    .footer {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--mu);
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="width:48px;height:48px;border-radius:14px;background:#0f6b5c;color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700;margin:0 auto 16px;">S</div>
    <h1>StarzanNotes</h1>
    <p>Live Online Test Series Platform</p>
    <div class="btn-group">
      <a class="btn btn-student" href="./student/">
        🎓 Launch Student App
      </a>
      <a class="btn btn-admin" href="./admin/">
        🛡️ Launch Admin Panel
      </a>
    </div>
    <div class="footer">
      Connected with Supabase Database
    </div>
  </div>
</body>
</html>
