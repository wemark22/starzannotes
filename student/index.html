async function prepTestQuestions(nid, k) {
  if (!sb) return;
  try {
    const { data: tests } = await sb.from('tests').select('*').or('node_id.eq.' + nid + ',id.eq.' + nid + ',id.eq.' + nid + '-' + k).limit(1);
    const tRow = tests && tests[0];
    const testId = tRow ? tRow.id : (nid + '-' + k);
    CUR_TEST_ID = testId;
    const { data: dbQ } = await sb.from('questions').select('*').eq('test_id', testId).order('sort_order', { ascending: true });
    if (dbQ && dbQ.length > 0) {
      Q = dbQ.map(q => [
        q.question_text,
        Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]'),
        q.correct_answer,
        q.explanation || '',
        q.topic || 'General',
        q.id
      ]);
    } else {
      Q = JSON.parse(JSON.stringify(DEFAULT_Q));
    }
    fetchLeaderboard(testId);
  } catch(e) {
    console.warn("prepTestQuestions error:", e);
  }
}

async function fetchLeaderboard(testId) {
  if (!sb || !testId) return;
  try {
    const { data: atts } = await sb.from('attempts').select('score, time_taken, users(name), user_id').eq('test_id', testId).order('score', { ascending: false }).order('time_taken', { ascending: true }).limit(20);
    if (atts && atts.length) {
      DB_LEADERBOARD[testId] = atts.map(a => ({
        n: a.users?.name || 'Student',
        s: Number(a.score),
        t: a.time_taken,
        me: a.user_id && S.user?.id && a.user_id === S.user.id
      }));
      R();
    }
  } catch(e) {
    console.warn("fetchLeaderboard error:", e);
  }
}

async function handleStudentAuth(user) {
  if (!user) return;
  const name = user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || 'Student';
  S.user = { id: user.id, n: name, e: user.email, avatar: user.user_metadata?.avatar_url || '' };
  sv();
  R();
  if (sb) {
    try {
      await sb.from('users').upsert({
        id: user.id,
        email: user.email,
        name: name,
        avatar: S.user.avatar || '',
        role: 'student',
        status: 'active',
        last_seen: new Date().toISOString()
      }, { onConflict: 'id' });
    } catch(e) { console.warn("User upsert error", e); }
    syncPurchases();
  }
}

async function syncPurchases() {
  if (!sb || !S.user?.id || !isUuid(S.user.id)) return;
  try {
    const { data: purs } = await sb.from('purchases').select('*').eq('user_id', S.user.id).eq('status', 'paid');
    if (purs && purs.length) {
      purs.forEach(p => {
        if (p.series_id && !S.own.includes(p.series_id)) S.own.push(p.series_id);
        if (!S.ord.some(o => o.id === p.id)) S.ord.push({ id: p.id, sid: p.series_id, amt: p.amount, at: new Date(p.created_at).getTime() });
      });
      sv();
      R();
    }
  } catch(e) {
    console.warn("syncPurchases error:", e);
  }
}
