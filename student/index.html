// DYNAMIC HIERARCHY BUILDER
function buildHierarchy(tests) {
  const seriesMap = {};
  N = {};

  tests.forEach(t => {
    const examName = (t.exam || 'General Practice Tests').trim();
    const sid = 'ser_' + slug(examName);

    if (!seriesMap[sid]) {
      let customLabel = t.label && t.label !== 'None' ? t.label : (t.is_paid ? 'Popular' : 'Free');
      seriesMap[sid] = {
        id: sid,
        sid: sid,
        n: examName,
        t: examName,
        x: 'Exam Series',
        d: t.description || (examName + ' Practice Test Series'),
        p: t.is_paid ? (t.price || 0) : 0,
        s: t.is_paid ? (t.sale_price || t.price || 0) : 0,
        im: t.banner || TH(1600, 1000, "#2b3a4a", "Exam", examName.split(" ")[0]),
        ch: [],
        tests: [],
        par: null,
        lb: customLabel,
        ln: 'series-' + sid
      };
      N[sid] = seriesMap[sid];
    }
    const series = seriesMap[sid];
    if (t.is_paid) {
      series.p = Math.max(series.p, t.price || 0);
      series.s = Math.max(series.s, t.sale_price || t.price || 0);
    }
    if (t.label && t.label !== 'None') {
      series.lb = t.label;
    }

    const subName = (t.subject || '').trim();
    const chName = (t.chapter || '').trim();
    const tpName = (t.topic || '').trim();

    // Level 1: Direct test under series (No subject)
    if (!subName) {
      series.tests.push(t);
      return;
    }

    // Level 2: Subject folder
    const subId = sid + '_sub_' + slug(subName);
    let subNode = N[subId];
    if (!subNode) {
      subNode = {
        id: subId,
        sid: sid,
        n: subName,
        par: sid,
        ch: [],
        tests: []
      };
      N[subId] = subNode;
      series.ch.push(subNode);
    }

    // Direct test under subject (No chapter)
    if (!chName) {
      subNode.tests.push(t);
      return;
    }

    // Level 3: Chapter folder
    const chId = subId + '_ch_' + slug(chName);
    let chNode = N[chId];
    if (!chNode) {
      chNode = {
        id: chId,
        sid: sid,
        n: chName,
        par: subId,
        ch: [],
        tests: []
      };
      N[chId] = chNode;
      subNode.ch.push(chNode);
    }

    // Direct test under chapter (No topic)
    if (!tpName) {
      chNode.tests.push(t);
      return;
    }

    // Level 4: Topic folder
    const tpId = chId + '_tp_' + slug(tpName);
    let tpNode = N[tpId];
    if (!tpNode) {
      tpNode = {
        id: tpId,
        sid: sid,
        n: tpName,
        par: chId,
        ch: [],
        tests: []
      };
      N[tpId] = tpNode;
      chNode.ch.push(tpNode);
    }

    tpNode.tests.push(t);
  });

  SER = Object.values(seriesMap);
}

const cnt = n => (n ? ((n.tests ? n.tests.length : 0) + (n.ch ? n.ch.reduce((a, c) => a + cnt(c), 0) : 0)) : 0);

const inNode = (testId, nodeId) => {
  let cur = N[nodeId];
  if (!cur) return false;
  if (cur.tests && cur.tests.some(t => t.id === testId)) return true;
  if (cur.ch) return cur.ch.some(c => inNode(testId, c.id));
  return false;
};

const dn = n => {
  let at = S.att.filter(a => inNode(a.testId || a.nid, n.id));
  return new Set(at.map(a => a.testId || a.nid)).size;
};

const bestOf = (testId) => {
  return S.att.filter(a => (a.testId === testId || a.nid === testId)).sort((a, b) => b.sc - a.sc)[0];
};

function lbd(testId) {
  let cached = DB_LEADERBOARDS[testId] || [];
  let L = cached.map(b => ({ n: b.n, s: b.s, t: b.t }));
  let be = bestOf(testId);
  if (be) {
    L.push({ n: S.user?.n || "You", s: be.sc, t: be.tk, me: 1 });
  }
  return L.sort((a, b) => b.s - a.s || a.t - b.t);
}

async function fetchLeaderboardFromDb(testId) {
  if (!sb || !testId) return;
  try {
    const { data: atts } = await sb.from('attempts')
      .select('score, time_taken, users(name), user_id')
      .eq('test_id', testId)
      .order('score', { ascending: false })
      .order('time_taken', { ascending: true })
      .limit(20);
    if (atts && atts.length) {
      DB_LEADERBOARDS[testId] = atts.map(a => ({
        n: a.users?.name ? (a.users.name.split(" ")[0] + " " + (a.users.name.split(" ")[1]?.[0] || "") + ".") : "Student",
        s: Number(a.score) || 0,
        t: Number(a.time_taken) || 0
      }));
      R();
    }
  } catch(e) { console.warn(e); }
}

  } catch(e) { console.warn(e); }
}

async function syncUserWithDb(user) {
  if (!sb || !user || !user.e) return;
  try {
    const { data: existing } = await sb.from('users').select('*').eq('email', user.e).maybeSingle();
    if (existing) {
      user.id = existing.id;
      user.status = existing.status || 'active';
      user.ban_reason = existing.ban_reason || '';
      await sb.from('users').update({ last_seen: new Date().toISOString() }).eq('id', existing.id);
    } else {
      const { data: inserted } = await sb.from('users').insert({
        name: user.n || 'Student',
        email: user.e,
        status: 'active',
        last_seen: new Date().toISOString()
      }).select().maybeSingle();
      if (inserted) {
        user.id = inserted.id;
        user.status = 'active';
      }
    }
    sv();
    R();
  } catch(e) { console.warn('syncUserWithDb error:', e); }
}

function sl(i) {
  let t = $("#trk");
  if (!t) return;
  cn = i;
  t.scrollTo({ left: i * t.clientWidth, behavior: "smooth" });
  dots();
}

function dots() {
  let t = $("#trk");
  if (!t) return;
  let i = Math.round(t.scrollLeft / t.clientWidth);
  cn = i;
  document.querySelectorAll(".dots button:not(.pz)").forEach((b, k) => b.classList.toggle("on", k == i));
  document.querySelectorAll(".sl").forEach((s, k) => s.classList.toggle("on", k == i));
}

function auto() {
  clearInterval(ci);
  ci = setInterval(() => {
    if (cp) return;
    let t = $("#trk");
    if (!t) return;
    let n = FE.length;
    if (n < 2) return;
    cn = (cn + 1) % n;
    sl(cn);
  }, 4800);
}

// START TEST
async function startTest(testId) {
  let t = TESTS_BY_ID[testId];
  if (!t && sb) {
    const { data } = await sb.from('tests').select('*').eq('id', testId).single();
    if (data) { t = data; TESTS_BY_ID[testId] = data; }
  }
  if (!t) return go("home");

  if (!S.user) return signin(() => startTest(testId));

  // Check account status
  if (S.user.status === 'banned' || S.user.status === 'suspended') {
    alert("Your account is currently " + S.user.status.toUpperCase() + ".\nReason: " + (S.user.ban_reason || 'Policy violation. Contact support.'));
    return;
  }

  // Check if series/test is paid and requires purchase
  let parentSeries = Object.values(N).find(n => !n.par && (n.tests?.some(x => x.id === testId) || (n.ch && inNode(testId, n.id))));
  let isPaid = (t.is_paid && t.price > 0) || (parentSeries && parentSeries.p > 0);
  let isOwned = (parentSeries && S.own.includes(parentSeries.id)) || S.own.includes(t.id);

  if (isPaid && !isOwned) {
    let target = parentSeries || t;
    M(`<h3>Unlock Premium Series</h3>
      <p class="mu"><b>${esc(target.t || target.title)}</b> is part of a premium package. Unlock it now to take tests, view solutions, and compete on the leaderboard.</p>
      <div class="pr" style="margin:16px 0; font-size:1.5rem;">
        <b>${inr(target.s || target.price)}</b>
        ${(target.p || target.price) > (target.s || target.price) ? `<s>${inr(target.p)}</s>` : ''}
      </div>
      <button class="b f" onclick="buy('${target.id || t.id}')">Unlock Now</button>
      <button class="b o f" style="margin-top:8px" onclick="X()">Cancel</button>`);
    return;
  }

  if (T && (T.testId == testId || T.nid == testId)) return go("take-test-" + testId);

  toast("Loading questions from cloud...");
  let fetchedQ = [];
  if (sb) {
    try {
      const { data: dbQ, error } = await sb.from('questions').select('*').eq('test_id', testId).order('sort_order', { ascending: true });
      if (dbQ && dbQ.length > 0 && !error) {
        fetchedQ = dbQ.map(q => [
          q.question_text,
          Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]'),
          q.correct_answer,
          q.explanation || 'Refer to reference notes.',
          q.topic || t.topic || t.subject || 'General',
          q.id
        ]);
      }
    } catch(err) { console.warn(err); }
  }

  if (!fetchedQ.length) {
    alert('This test has no questions added yet. Please add questions from the Admin Panel first.');
    return;
  }

  Q = fetchedQ;
  let timerMin = t.timer_minutes || 10;
  T = {
    testId: t.id,
    title: t.title,
    nid: t.id,
    k: 1,
    marksPos: t.marks_per_correct || 1,
    marksNeg: t.negative_on !== false ? (t.negative_value || 0.33) : 0,
    a: Q.map(_ => -1),
    r: Q.map(_ => 0),
    v: Q.map(_ => 0),
    q: 0,
    st: Date.now(),
    end: Date.now() + (timerMin * 60 * 1000),
    tt: Q.map(_ => 0),
    lq: Date.now()
  };
  sv();
  go("take-test-" + t.id);
}

// TEST TAKING INTERFACE (With Clear "Bookmark for review" naming)
function take() {
  if (!T) return go("home");
  A.innerHTML = `<header class="xh">
    <div class="w">
      <button class="bkb" aria-label="Leave test" onclick="if(confirm('Leave the test? Your answers are saved and the timer keeps running.'))go('test-${T.testId}')">
        ${ic("back")}<span>Leave</span>
      </button>
      <span class="ell"><span class="idc" style="padding:1px 6px; font-size:0.75rem; margin-right:6px;">${T.testId}</span> ${esc(T.title || "Test")}</span>
      <button class="ib pb" aria-label="Question palette" onclick="pal()">${ic("grid")}</button>
      <span id="tm" class="tmr" role="timer">${ic("clock")}<span id="tt"></span></span>
    </div>
    <div class="pg"><i id="pgb"></i></div>
  </header>
  <main class="w xg">
    <section id="qa"></section>
    <aside id="sd" class="sd"></aside>
  </main>
  <div class="ct xf"><div class="w" id="xf"></div></div>`;

  draw();
  tk();
  clearInterval(tm);
  tm = setInterval(tk, 500);
}

function tk() {
  if (!T) return;
  let rem = Math.max(0, Math.round((T.end - Date.now()) / 1000));
  let e = $("#tt"), p = $("#tm");
  if (e) e.textContent = mmss(rem);
  if (p) p.classList.toggle("warn", rem < 120);
  if (rem <= 0) fin();
}

function lap() {
  if (!T || !Q.length) return;
  let now = Date.now();
  let dt = Math.round((now - T.lq) / 1000);
  if (T.q >= 0 && T.q < T.tt.length) T.tt[T.q] = (T.tt[T.q] || 0) + dt;
  T.lq = now;
}

function draw() {
  if (!T || !Q.length) return;
  let q = Q[T.q], a = T.a[T.q], rv = T.r[T.q];
  T.v[T.q] = 1;

  let qa = $("#qa");
  if (qa) {
    qa.innerHTML = `<div class="qh">
      <div>
        <span class="qn">Question ${T.q + 1} of ${Q.length}</span>
        ${q[4] ? `<span class="eb" style="margin-left:8px">${esc(q[4])}</span>` : ""}
      </div>
      <button class="rf${rv ? " on" : ""}" title="Bookmark this question for yourself to check before submitting" onclick="togR()">${ic("flag")} ${rv ? "Bookmarked (Review later)" : "Bookmark for later"}</button>
    </div>
    <div class="qt">${esc(q[0])}</div>
    <div class="op" role="radiogroup">${q[1].map((o, i) => `<button class="rw${a == i ? " on" : ""}" role="radio" aria-checked="${a == i}" onclick="ans(${i})"><i></i><span><b>${"ABCD"[i]}.</b> ${esc(o)}</span></button>`).join("")}</div>`;
  }

  let xf = $("#xf");
  if (xf) {
    xf.innerHTML = `<button class="b o" onclick="clr()">Clear answer</button>
      <span class="sp">
        <button class="b o" ${T.q == 0 ? "disabled" : ""} onclick="move(-1)">${ic("back")} Previous</button>
        ${T.q == Q.length - 1 ? `<button class="b" onclick="subD()">Submit test</button>` : `<button class="b" onclick="move(1)">Next ${ic("chev")}</button>`}
      </span>`;
  }

  let pgb = $("#pgb");
  if (pgb) pgb.style.width = Math.round((T.q + 1) / Q.length * 100) + "%";

  let sd = $("#sd");
  if (sd) sd.innerHTML = palBody();
}

function palBody() {
  if (!T) return "";
  let an = T.a.filter(x => x >= 0).length, rv = T.r.filter(x => x).length;
  return `<div class="ph2">
    <div><b>Question palette</b><small class="mu">${an} answered · ${rv} bookmarked</small></div>
    <button class="ib" aria-label="Close palette" onclick="pal(0)">${ic("x")}</button>
  </div>
  <div class="plg">${Q.map((_, i) => {
    let a = T.a[i] >= 0, r = T.r[i], v = T.v[i], c = T.q == i ? "cur " : "";
    let k = r && a ? "mka" : r ? "mk" : a ? "ans" : v ? "vis" : "unv";
    return `<button class="pb ${c}${k}" onclick="jump(${i})">${i + 1}</button>`;
  }).join("")}</div>
  <button class="b f" style="margin-top:16px" onclick="subD()">Submit test</button>`;
}

function pal(o) {
  let s = $("#sd");
  if (!s) return;
  s.classList.toggle("open", o !== undefined ? o : !s.classList.contains("open"));
  if (s.classList.contains("open")) s.innerHTML = palBody();
}

function ans(i) {
  lap();
  T.a[T.q] = i;
  sv();
  draw();
}

function clr() {
  lap();
  T.a[T.q] = -1;
  sv();
  draw();
}

function togR() {
  T.r[T.q] = !T.r[T.q];
  sv();
  draw();
}

function move(d) {
  jump(T.q + d);
}

function jump(i) {
  if (i < 0 || i >= Q.length) return;
  lap();
  T.q = i;
  sv();
  draw();
  pal(0);
}

function subD() {
  lap();
  let a = T.a.filter(x => x >= 0).length;
  let u = Q.length - a;
  let r = T.r.filter(x => x).length;
  M(`<h3>Submit your test?</h3>
    <ul class="cl2 mu" style="margin:14px 0 20px;">
      <li>${ic("check")}${a} answered</li>
      <li>${ic("check")}${u} unanswered</li>
      <li>${ic("flag")}${r} bookmarked for review</li>
    </ul>
    <p class="mu" style="font-size:0.9rem;">Once submitted, your final score and detailed solutions will be shown.</p>
    <button class="b f" onclick="fin()">Submit now</button>
    <button class="b o f" style="margin-top:8px" onclick="X()">Keep answering</button>`);
}

function fin() {
  clearInterval(tm);
  X();
  lap();
  let c = 0, w = 0, tp = {};
  Q.forEach((q, i) => {
    let a = T.a[i];
    let topName = q[4] || 'General';
    let tObj = tp[topName] = tp[topName] || [0, 0];
    tObj[1]++;
    if (a == q[2]) {
      c++;
      tObj[0]++;
    } else if (a >= 0) {
      w++;
    }
  });

  let mPos = T.marksPos || 1;
  let mNeg = T.marksNeg || 0.33;
  let finalScore = Math.round((c * mPos - w * mNeg) * 100) / 100;
  let maxScore = Math.round((Q.length * mPos) * 100) / 100;
  
  let attObj = {
    testId: T.testId || T.nid,
    nid: T.nid,
    k: 1,
    title: T.title || (TESTS_BY_ID[T.testId]?.title || 'Practice Test'),
    questions: Q,
    a: T.a,
    tt: T.tt,
    c, w,
    u: Q.length - c - w,
    sc: finalScore,
    mx: maxScore,
    tk: Math.round((Date.now() - T.st) / 1000),
    tp,
    marksPos: mPos,
    marksNeg: mNeg,
    at: Date.now()
  };

  S.att.push(attObj);
  saveAttemptToDb(attObj);
  T = null;
  sv();
  RF = "all";
  go("result-" + (S.att.length - 1));
}

// RESULT PAGE
function result(i) {
  let r = S.att[i];
  if (!r) return go("home");
  
  let testTitle = r.title || (TESTS_BY_ID[r.testId || r.nid]?.title || (N[r.nid] ? N[r.nid].n : 'Practice Test'));
  let pc = Math.max(0, Math.round(r.sc / (r.mx || 1) * 1000) / 10);
  let ac = (r.c + r.w) ? Math.round(r.c / (r.c + r.w) * 100) : 0;
  let L = lbd(r.testId || r.nid);
  let rk = L.findIndex(l => l.me) + 1;
  let ts = Object.entries(r.tp || {}).map(([k, v]) => [k, v[0], v[1]]).sort((a, b) => (a[1] / a[2]) - (b[1] / b[2]));
  let C = 2 * Math.PI * 54;

  shell("learn", `
    <main class="w">
      <div class="rh2">
        <div class="rg">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="54" fill="none" stroke="#ffffff30" stroke-width="10"/>
            <circle class="rc" style="--c:${C}" cx="66" cy="66" r="54" fill="none" stroke="#8fd8c6" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pc / 100)}"/>
          </svg>
          <div>${pc}%</div>
        </div>
        <div>
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="idc">${ic("lock")}ID: ${r.testId || r.nid}</span>
            <small style="color:#cfe3dd;">${esc(testTitle)}</small>
          </div>
          <h2>${r.sc} / ${r.mx} marks</h2>
          <p style="margin:0;color:#cfe3dd">
            ${pc >= 75 ? "Excellent work!" : pc >= 50 ? "Good effort. Keep practising!" : "Keep practicing, you will improve!"}
            ${rk ? ` Rank ${rk} on this test.` : ''}
          </p>
        </div>
      </div>
      <div class="st">
        <div><small>Correct</small><b>${r.c}</b></div>
        <div><small>Incorrect</small><b>${r.w}</b></div>
        <div><small>Unanswered</small><b>${r.u}</b></div>
        <div><small>Accuracy</small><b>${ac}%</b></div>
        <div><small>Time taken</small><b>${mmss(r.tk)}</b></div>
        <div><small>Attempted</small><b>${r.c + r.w}/${r.c + r.w + (r.u || 0)}</b></div>
      </div>
      ${ts.length ? `
        <div class="sec" style="margin-top:26px"><h2>Topic breakdown</h2></div>
        ${ts.map(t => `<div class="ln"><span>${esc(t[0])}</span><small>${t[1]}/${t[2]} correct</small></div><div class="bar"><i style="width:${Math.round(t[1]/t[2]*100)}%"></i></div>`).join("")}
      ` : ''}
      <div class="sec" style="margin-top:30px">
        <h2>Review questions</h2>
        <span class="chip">Detailed Solutions</span>
      </div>
      <div id="rv">${rev(i)}</div>
    </main>
  `,
  `<div class="ctl"><small>Finished</small><b>${esc(testTitle)}</b></div>
  <button class="b" onclick="go('home')">Return Home</button>`,
  ["home", "Home"]);
}

function rev(i) {
  let r = S.att[i];
  if (!r) return "";
  let qList = (r.questions && r.questions.length) ? r.questions : Q;
  return `<div class="tabs">${[["all","All"],["ok","Correct"],["no","Incorrect"],["un","Skipped"]].map(f=>`<button class="${RF==f[0]?"on":""}" onclick="rfs('${f[0]}',${i})">${f[1]}</button>`).join("")}</div>` +
    (qList.map((q, k) => {
      let a = r.a[k], ok = a == q[2], st = a < 0 ? "un" : ok ? "ok" : "no";
      if (RF != "all" && RF != st) return "";
      return `<div class="rvw rs-${st}">
        <div class="rh">
          <span class="bd">${st=="ok"?"Correct":st=="no"?"Incorrect":"Skipped"}</span>
          <small>${a < 0 ? "0" : (ok ? "+" + (r.marksPos || 1) : "−" + (r.marksNeg || 0.33))} marks · ${mmss(r.tt[k] || 0)}</small>
        </div>
        <b>${k + 1}. ${esc(q[0])}</b>
        <div class="an2">${q[1].map((o, j) => `<div class="${j==q[2]?"oc":j==a?"ow":""}">${"ABCD"[j]}. ${esc(o)}${j==q[2]?" ✓":j==a?" ✗":""}</div>`).join("")}</div>
        <div class="exp"><b>Explanation:</b> ${esc(q[3] || 'Refer to study notes.')}</div>
        <button class="b o s" style="margin-top:10px; font-size:0.82rem;" onclick="promptReport('${r.testId || r.nid}', ${k})">⚠️ Report a mistake in this question to Admin</button>
      </div>`;
    }).join(""));
}

function rfs(f, i) {
  RF = f;
  let el = $("#rv");
  if (el) el.innerHTML = rev(i);
}

// Clear Interactive Report Modal for Students -> Delivered directly to Supabase Reports Table
function promptReport(testId, qIdx) {
  M(`<h3>Report Question #${qIdx + 1}</h3>
    <p class="mu">Notice a mistake? Send details to the teacher/admin so it can be verified and updated.</p>

    <select id="rep_reason" class="in" style="margin-bottom:12px;">

    <textarea id="rep_note" class="in" rows="3" placeholder="Describe the mistake clearly..."></textarea>

async function sendStudentReport(testId, qIdx) {
  let reason = $("#rep_reason")?.value || 'Wrong answer key';
  let note = ($("#rep_note")?.value || '').trim();

  toast("Delivering report to Admin Panel...");

}

// MY LEARNING PAGE
function learn() {
  if (!S.user) {
    return shell("learn", `<main class="w">
      <div class="em" style="margin-top:32px; padding:40px 20px; background:var(--sf); border:1px solid var(--br); border-radius:20px;">
        <h2>Sign in to track your learning</h2>
        <p class="mu" style="max-width:440px; margin:8px auto 20px;">Your test attempts, leaderboard scores, and unlocked series are synchronized with your account.</p>
        <button class="b" onclick="signin()">Sign in to StarzanNotes</button>
      </div>
      <div class="sec" style="margin-top:36px;"><h2>Help and policies</h2></div>
      ${docs()}
    </main>`);
  }

  let tk2 = S.att.length;
  let av = tk2 ? Math.round(S.att.reduce((a, r) => a + Math.max(0, r.sc / (r.mx || 1)), 0) / tk2 * 100) : 0;
  let bs = tk2 ? Math.round(Math.max(...S.att.map(r => Math.max(0, r.sc / (r.mx || 1)))) * 100) : 0;

  shell("learn", `<main class="w">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:28px;">
      <div style="display:flex; align-items:center; gap:14px;">
        <span class="av" style="width:48px; height:48px; border-radius:14px; font-size:1.3rem;">${esc(S.user.n[0] || 'S').toUpperCase()}</span>
        <div>
          <h1 style="margin:0; font-size:1.5rem;">Hi, ${esc(S.user.n)}</h1>
          <small class="mu">${esc(S.user.e)}</small>
        </div>
      </div>
      <button class="b o s" onclick="appSignOut()">Sign out</button>
    </div>

    ${S.user.status === 'warned' ? `
      <div class="hint bad" style="margin:16px 0; padding:12px 16px; border-radius:12px; border:1px solid #e53e3e;">
        ⚠️ <b>Warning Notice:</b> Your account was flagged by the administrator: ${esc(S.user.ban_reason || 'Please adhere to fair testing rules.')}
      </div>
    ` : ''}

    <div class="st" style="grid-template-columns:repeat(3,1fr); margin:20px 0;">
      <div><small>Tests taken</small><b>${tk2}</b></div>
      <div><small>Average</small><b>${av}%</b></div>
      <div><small>Best score</small><b>${bs}%</b></div>
    </div>

    <div class="sec"><h2>My test series</h2></div>
    <div class="ms">
      ${S.own.length ? S.own.map(id => N[id] ? card(N[id]) : '').filter(Boolean).join('') : '<div class="em" style="grid-column:1/-1;">No purchased series yet. <a href="#explore" style="color:var(--ac); text-decoration:underline;"><b>Explore Series</b></a></div>'}
    </div>

    <div class="sec"><h2>My attempts</h2></div>
    ${S.att.length ? S.att.map((r, i) => `
      <a class="tr" href="#result-${i}">
        <span class="fi">${ic("check")}</span>
        <div>
          <b>${esc(r.title || 'Practice Test')}</b>
          <small><span class="idc" style="padding:1px 5px; font-size:0.75rem;">${r.testId || r.nid}</span> · ${new Date(r.at).toLocaleDateString("en-IN")} · ${r.c} correct · ${r.w} wrong</small>
        </div>
        <span class="sb">${r.sc}/${r.mx}</span>
      </a>
    `).reverse().join("") : '<div class="em">No attempts yet. Practice a test to see results here.</div>'}

    <div class="sec" style="margin-top:28px;"><h2>Help and policies</h2></div>
    ${docs()}
  </main>`);
}

function docs() {
  return Object.entries(PG).map(x => `<a class="tr" href="#page-${x[0]}"><span class="fi">${ic("book")}</span><div><b>${x[1]}</b></div>${ic("chev")}</a>`).join("");
}

function pageV(k) {
  if (!PG[k]) return go("home");
  let content = CFG.legal && CFG.legal[k] ? CFG.legal[k] : LEG[k];
  shell("home", `<main class="w"><article class="doc" style="padding:28px 0;">${fmtDoc(content)}</article></main>`, "", ["home", "Home"]);
}

function fmtDoc(t) {
  let h = "", ul = 0, hd = /^(\d+\.\s|What you get$|Our promise$|You can get a full refund if$|Refunds are not given when$|How to ask$|How you get the money$|Contact us$|[^.]{3,60}\?$)/;
  t.split("\n").forEach((l, i) => {
    l = l.trim();
    let li = l.startsWith("- ");
    if (ul && !li) { h += "</ul>"; ul = 0; }
    if (!l) return;
    if (li) {
      if (!ul) { h += "<ul>"; ul = 1; }
      h += "<li>" + esc(l.slice(2)) + "</li>";
    } else if (i == 0) h += "<h1>" + esc(l) + "</h1>";
    else if (hd.test(l)) h += "<h3>" + esc(l) + "</h3>";
    else h += "<p" + (/^Last updated/.test(l) ? ' class="mu"' : "") + ">" + esc(l) + "</p>";
  });
  return h + (ul ? "</ul>" : "");
}

// AUTH & MODALS
function M(h) {
  let m = $("#m");
  if (!m) {
    m = document.createElement("div");
    m.id = "m";
    m.className = "ov";
    document.body.appendChild(m);
  }
  m.innerHTML = `<div class="md" role="dialog" aria-modal="true">${h}</div>`;
  m.classList.add("sh");
}

function X() {
  let m = $("#m");
  if (m) m.classList.remove("sh");
}

function signin(cb) {
  CB = cb;
  M(`<h3>Sign in to StarzanNotes</h3>
    <p class="mu">Save attempts, track rankings and unlock test series.</p>
    <label class="l2" for="stu_name">Your Name</label>
    <input id="stu_name" class="in" placeholder="e.g. Rahul Sharma" style="margin-bottom:12px;">
    <label class="l2" for="stu_email">Your Email</label>
    <input id="stu_email" class="in" type="email" placeholder="e.g. rahul@gmail.com" style="margin-bottom:16px;">
    <button class="b f" style="margin-bottom:10px" onclick="submitStudentLogin()">Continue</button>
    <button class="b o f" style="margin-bottom:8px" onclick="googleAuth()">Sign in with Google</button>
    <button class="b o f" onclick="X()">Cancel</button>`);
}

async function submitStudentLogin() {
  let name = ($("#stu_name")?.value || "").trim();
  let email = ($("#stu_email")?.value || "").trim();
  if (!email || !email.includes('@')) {
    alert("Please enter a valid email address.");
    return;
  }
  S.user = { id: 'usr_' + Date.now(), n: name || email.split('@')[0], e: email };
  sv();
  X();
  toast("Signing in...");
  await syncUserWithDb(S.user);
  toast("Welcome, " + S.user.n + "!");
  R();
  if (CB) CB();
}

async function googleAuth() {
  if (sb) {
    try {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
    } catch(err) {
      toast("Google login redirecting...");
    }
  } else {
    submitStudentLogin();
  }
}

function appSignOut() {
  if (sb) { try { sb.auth.signOut(); } catch(e) {} }
  S.user = null;
  sv();
  toast("Signed out");
  R();
}

async function buy(id) {
  if (!S.user) return signin(() => buy(id));
  let nodeItem = N[id] || TESTS_BY_ID[id];
  let title = nodeItem?.t || nodeItem?.title || 'Test Series';
  let price = nodeItem?.s || nodeItem?.price || 299;

  M(`<h3>Unlock ${esc(title)}</h3>
    <p class="mu">Complete payment to get instant access to all tests & explanations.</p>
    <div class="pr" style="margin:16px 0; font-size:1.6rem;"><b>${inr(price)}</b></div>
    <button class="b f" onclick="confirmPurchase('${id}', ${price}, '${esc(title)}')">Pay ${inr(price)} (Demo)</button>
    <button class="b o f" style="margin-top:8px" onclick="X()">Cancel</button>`);
}

async function confirmPurchase(id, amt, title) {
  if (!S.own.includes(id)) S.own.push(id);
  S.ord = S.ord || [];
  S.ord.push({ sid: id, title: title, amt: amt, at: Date.now() });
  sv();
  X();
  toast("🎉 Series unlocked successfully!");
  if (sb && S.user) {
    try {
      await sb.from('purchases').insert({
        user_id: isUuid(S.user.id) ? S.user.id : null,
        series_id: id,
        amount: amt,
        status: 'paid',
        payment_method: 'demo',
        created_at: new Date().toISOString()
      });
    } catch(e) { console.warn(e); }
  }
  R();
}

// ROUTER
function route() {
  let h = location.hash || "#home";
  let i = HS.indexOf(h);
  if (i >= 0) {
    HS.length = i + 1;
    SYNC = SY[h] || 0;
  } else {
    HS.push(h);
    SYNC = 0;
  }
  CUR = h;
  R();
}

function R() {
  clearInterval(tm);
  clearInterval(ci);
  let y = scrollY;
  let p = (location.hash.slice(1) || "home").split("-");

  if (CFG.maint) {
    A.innerHTML = `<main class="w" style="min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 18px;">
      <div style="width:72px; height:72px; border-radius:20px; background:var(--hi); color:var(--ac); display:grid; place-items:center; font-size:2rem; margin-bottom:20px;">
        ${ic("clock")}
      </div>
      <h1 style="font-family:Fraunces,Georgia,serif; font-size:clamp(1.8rem,5vw,2.4rem); margin:0 0 12px;">Under Maintenance</h1>
      <p class="mu" style="max-width:480px; font-size:1.05rem; line-height:1.6; margin:0 0 28px;">${esc(CFG.mmsg || 'We are currently updating StarzanNotes. Please check back shortly.')}</p>
      <button class="b" onclick="loadConfig(); toast('Checking status...')">Refresh Page</button>
    </main>`;
    return;
  }

  // Handle custom test taking e.g. #take-test-DC27A
  if (p[0] === 'take' && p[1] === 'test' && p[2]) {
    take();
    scrollTo(0, 0);
    return;
  }

  // Handle test overview by ID e.g. #test-DC27A
  if (p[0] === 'test' && p[1]) {
    test(p[1]);
    scrollTo(0, 0);
    return;
  }

  ({
    home,
    explore,
    learn,
    series: () => node(p[1]),
    node: () => node(p[1]),
    result: () => result(+p[1]),
    page: () => pageV(p[1])
  }[p[0]] || home)();

  scrollTo(0, SYNC >= 0 ? SYNC : y);
}

// DATA LOADERS FROM SUPABASE
async function loadConfig() {
  if (!sb) return;
  try {
    const { data: cfg } = await sb.from('config').select('*').eq('id', 'main').maybeSingle();
    if (cfg) {
      CFG = {
        name: cfg.name || CFG.name,
        tag: cfg.tag || CFG.tag,
        maint: !!cfg.maintenance,
        mmsg: cfg.maintenance_msg || CFG.mmsg,
        email: cfg.email || CFG.email,
        phone: cfg.phone || CFG.phone,
        wa: cfg.wa || CFG.wa,
        legal: {
          priv: cfg.legal_privacy || LEG.priv,
          terms: cfg.legal_terms || LEG.terms,
          about: cfg.legal_about || LEG.about,
          refund: cfg.legal_refund || LEG.refund,
          help: cfg.legal_help || LEG.help
        }
      };
      document.title = CFG.name + " - Test Series";
      R();
    }
  } catch(e) { console.warn(e); }
}

async function loadBanners() {
  if (!sb) return;
  try {
    const { data: bns, error } = await sb.from('banners').select('*').eq('is_active', true).order('sort_order', { ascending: true });
    if (bns && !error) {
      FE = bns.map(b => ({
        id: b.id,
        t: b.title,
        d: b.subtitle || '',
        im: b.image_url || TH(1600, 1000, "#2b3a4a", "Exam", (b.title || "Banner").split(" ")[0]),
        ln: b.link ? b.link.replace(/^#/, '') : 'explore'
      }));
      R();
    }
  } catch(e) { console.warn(e); }
}

async function loadSeriesAndTests() {
  if (!sb) return;
  try {
    const { data: dbTests, error } = await sb.from('tests').select('*').eq('status', 'published').order('created_at', { ascending: false });
    if (dbTests && !error) {
      LIVE_TESTS = dbTests;
      TESTS_BY_ID = {};
      dbTests.forEach(t => { TESTS_BY_ID[t.id] = t; });

      const { data: qData } = await sb.from('questions').select('test_id');
      const qMap = {};
      (qData || []).forEach(q => { qMap[q.test_id] = (qMap[q.test_id] || 0) + 1; });
      LIVE_TESTS.forEach(t => { t.qCount = qMap[t.id] || 0; });

      buildHierarchy(dbTests);
      R();
    }
  } catch(e) { console.warn(e); }
}

addEventListener("hashchange", route);
route();

// Initialize cloud data
loadConfig();
loadBanners();
loadSeriesAndTests();
if (S.user) syncUserWithDb(S.user);
