function slug(s) {
  return String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '') || 'item';
}

function buildHierarchy(tests) {
  const seriesMap = {};
  N = {};

  tests.forEach(t => {
    const examName = (t.exam || 'General Mock Tests').trim();
    const sid = 'ser_' + slug(examName);

    if (!seriesMap[sid]) {
      seriesMap[sid] = {
        id: sid,
        sid: sid,
        n: examName,
        t: examName,
        x: 'Exam Series',
        d: t.description || (examName + ' Practice Test Series'),
        p: t.is_paid ? (t.price || 0) : 0,
        s: t.is_paid ? (t.sale_price || t.price || 0) : 0,
        im: t.banner || TH(1600, 1000, "#2b3a4a", "Exam", examName.split(" ")[0]),
        ch: [],
        tests: [],
        par: null,
        lb: t.label || 'Popular',
        ln: 'series-' + sid
      };
      N[sid] = seriesMap[sid];
    }
    const series = seriesMap[sid];
    if (t.is_paid) {
      series.p = Math.max(series.p, t.price || 0);
      series.s = Math.max(series.s, t.sale_price || t.price || 0);
    }

    const subName = (t.subject || '').trim();
    const chName = (t.chapter || '').trim();
    const tpName = (t.topic || '').trim();

    if (!subName) {
      series.tests.push(t);
      return;
    }

    const subId = sid + '_sub_' + slug(subName);
    let subNode = N[subId];
    if (!subNode) {
      subNode = {
        id: subId,
        sid: sid,
        n: subName,
        par: sid,
        ch: [],
        tests: []
      };
      N[subId] = subNode;
      series.ch.push(subNode);
    }

    if (!chName) {
      subNode.tests.push(t);
      return;
    }

    const chId = subId + '_ch_' + slug(chName);
    let chNode = N[chId];
    if (!chNode) {
      chNode = {
        id: chId,
        sid: sid,
        n: chName,
        par: subId,
        ch: [],
        tests: []
      };
      N[chId] = chNode;
      subNode.ch.push(chNode);
    }

    if (!tpName) {
      chNode.tests.push(t);
      return;
    }

    const tpId = chId + '_tp_' + slug(tpName);
    let tpNode = N[tpId];
    if (!tpNode) {
      tpNode = {
        id: tpId,
        sid: sid,
        n: tpName,
        par: chId,
        ch: [],
        tests: []
      };
      N[tpId] = tpNode;
      chNode.ch.push(tpNode);
    }

    tpNode.tests.push(t);
  });

  SER = Object.values(seriesMap);
}

const cnt = n => (n ? ((n.tests ? n.tests.length : 0) + (n.ch ? n.ch.reduce((a, c) => a + cnt(c), 0) : 0)) : 0);

const inNode = (testId, nodeId) => {
  let cur = N[nodeId];
  if (!cur) return false;
  if (cur.tests && cur.tests.some(t => t.id === testId)) return true;
  if (cur.ch) return cur.ch.some(c => inNode(testId, c.id));
  return false;
};

const dn = n => {
  let at = S.att.filter(a => inNode(a.testId || a.nid, n.id));
  return new Set(at.map(a => a.testId || a.nid)).size;
};

const bestOf = (testId) => {
  return S.att.filter(a => (a.testId === testId || a.nid === testId)).sort((a, b) => b.sc - a.sc)[0];
};

function lbd(testId) {
  let cached = DB_LEADERBOARDS[testId] || [];
  let L = cached.map(b => ({ n: b.n, s: b.s, t: b.t }));
  let be = bestOf(testId);
  if (be) {
    L.push({ n: S.user?.n || "You", s: be.sc, t: be.tk, me: 1 });
  }
  return L.sort((a, b) => b.s - a.s || a.t - b.t);
}

async function fetchLeaderboardFromDb(testId) {
  if (!sb || !testId) return;
  try {
    const { data: atts } = await sb.from('attempts')
      .select('score, time_taken, users(name), user_id')
      .eq('test_id', testId)
      .order('score', { ascending: false })
      .order('time_taken', { ascending: true })
      .limit(20);
    if (atts && atts.length) {
      DB_LEADERBOARDS[testId] = atts.map(a => ({
        n: a.users?.name ? (a.users.name.split(" ")[0] + " " + (a.users.name.split(" ")[1]?.[0] || "") + ".") : "Student",
        s: Number(a.score) || 0,
        t: Number(a.time_taken) || 0
      }));
      R();
    }
  } catch(e) { console.warn(e); }
}

async function saveAttemptToDb(att) {
  if (!sb) return;
  try {
    const payload = {
      user_id: isUuid(S.user?.id) ? S.user.id : null,
      test_id: att.testId || att.nid,
      answers: att.a,
      time_per_question: att.tt,
      correct: att.c,
      wrong: att.w,
      unattempted: att.u,
      score: att.sc,
      max_score: att.mx,
      time_taken: att.tk,
      topic_analysis: att.tp,
      completed_at: new Date().toISOString()
    };
    await sb.from('attempts').insert(payload);
    fetchLeaderboardFromDb(payload.test_id);
  } catch(e) { console.warn(e); }
}

function sl(i) {
  let t = $("#trk");

function dots() {
  let t = $("#trk");
  if (!t || !FE.length) return;
  let n = Math.round(t.scrollLeft / t.clientWidth);
  if (n == cn && t.dataset.i) return;
  cn = n;
  t.dataset.i = 1;
  document.querySelectorAll(".sl").forEach((e, j) => e.classList.toggle("on", j == cn));
  document.querySelectorAll(".dots button[aria-label^=Slide]").forEach((e, j) => e.classList.toggle("on", j == cn));
  auto();
}

function auto() {
  clearInterval(ci);
  if (!FE.length) return;
  ci = setInterval(() => {
    if (!cp && !document.hidden) sl((cn + 1) % FE.length);
  }, 5000);

    <div class="tabs">${["All", "Free", "Paid"].map(x => `<button class="${F.x == x ? "on" : ""}" onclick="F.x='${x}';explore()">${x}</button>`).join("")}</div>
    <div id="ls" class="gr"></div>
  </main>`);
  lst();
}

function lst() {
  let q = F.q.toLowerCase();
  let filteredSeries = SER.filter(s => {
    let matchesQ = (s.t + " " + (s.d || "")).toLowerCase().includes(q);
    let matchesType = F.x === "All" || (F.x === "Free" && !s.p) || (F.x === "Paid" && s.p);
    return matchesQ && matchesType;
  });

  let filteredTests = LIVE_TESTS.filter(t => {
    let matchesQ = (t.title + " " + (t.exam || "") + " " + (t.subject || "")).toLowerCase().includes(q);
    let matchesType = F.x === "All" || (F.x === "Free" && !t.is_paid) || (F.x === "Paid" && t.is_paid);
    return matchesQ && matchesType;
  });

  let out = "";
  if (filteredSeries.length) {
    out += filteredSeries.map(card).join("");
  }
  if (filteredTests.length) {
    out += filteredTests.map(testCard).join("");
  }
  $("#ls").innerHTML = out || '<div class="em">No tests or series match your search.</div>';
}

// START TEST
async function startTest(testId) {
  let t = TESTS_BY_ID[testId];
  if (!t && sb) {
    const { data } = await sb.from('tests').select('*').eq('id', testId).single();
    if (data) { t = data; TESTS_BY_ID[testId] = data; }
  }
  if (!t) return go("home");

  if (!S.user) return signin(() => startTest(testId));
  if (T && (T.testId == testId || T.nid == testId)) return go("take-test-" + testId);

  toast("Loading questions from cloud...");
  let fetchedQ = [];
  if (sb) {
    try {
      const { data: dbQ, error } = await sb.from('questions').select('*').eq('test_id', testId).order('sort_order', { ascending: true });
      if (dbQ && dbQ.length > 0 && !error) {
        fetchedQ = dbQ.map(q => [
          q.question_text,
          Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]'),
          q.correct_answer,
          q.explanation || 'Refer to reference notes.',
          q.topic || t.topic || t.subject || 'General'
        ]);
      }
    } catch(err) { console.warn(err); }
  }

  if (!fetchedQ.length) {
    alert('This test has no questions added yet. Please add questions from the Admin Panel first.');
    return;
  }

  Q = fetchedQ;
  let timerMin = t.timer_minutes || 10;
  T = {
    testId: t.id,
    title: t.title,
    nid: t.id,
    k: 1,
    marksPos: t.marks_per_correct || 1,
    marksNeg: t.negative_on !== false ? (t.negative_value || 0.33) : 0,
    a: Q.map(_ => -1),
    r: Q.map(_ => 0),
    v: Q.map(_ => 0),
    q: 0,
    st: Date.now(),
    end: Date.now() + (timerMin * 60 * 1000),
    tt: Q.map(_ => 0),
    lq: Date.now()
  };
  sv();
  go("take-test-" + t.id);
}

// TEST TAKING INTERFACE
function take() {
  if (!T) return go("home");
  A.innerHTML = `<header class="xh">
    <div class="w">
      <button class="bkb" aria-label="Leave test" onclick="if(confirm('Leave the test? Your answers are saved and the timer keeps running.'))go('test-${T.testId}')">
        ${ic("back")}<span>Leave</span>
      </button>
      <span class="ell">${esc(T.title || "Test")}</span>
      <button class="ib pb" aria-label="Question palette" onclick="pal()">${ic("grid")}</button>
      <span id="tm" class="tmr" role="timer">${ic("clock")}<span id="tt"></span></span>
    </div>
    <div class="pg"><i id="pgb"></i></div>
  </header>
  <main class="w xg">
    <section id="qa"></section>
    <aside id="sd" class="sd"></aside>
  </main>
  <div class="ct xf"><div class="w" id="xf"></div></div>`;

  draw();
  tk();
  clearInterval(tm);
  tm = setInterval(tk, 1000);
}

function tk() {
  let r = Math.round((T.end - Date.now()) / 1000);
  if (r <= 0) return fin();
  let tt = $("#tt");
  let tmEl = $("#tm");
  if (tt) tt.textContent = mmss(r);
  if (tmEl) tmEl.classList.toggle("lw", r < 60);
}

function lap() {
  if (!T || !T.tt) return;
  T.tt[T.q] = (T.tt[T.q] || 0) + (Date.now() - T.lq) / 1000;
  T.lq = Date.now();
}

function plp() {
  return `<div class="pl">${Q.map((_, i) => `<button class="pn${T.v[i] ? " vs" : ""}${T.a[i] >= 0 ? " an" : ""}${T.r[i] ? " rv" : ""}${i == T.q ? " cu" : ""}" aria-label="Question ${i + 1}" onclick="X();jump(${i})">${i + 1}</button>`).join("")}</div>
  <div class="lgd"><span style="--k:var(--ac)">Answered</span><span style="--k:var(--gd)">Marked</span><span style="--k:var(--hi)">Not answered</span><span style="--k:var(--sf)">Not visited</span></div>`;
}

function pal() {
  M(`<h3>Question palette</h3>${plp()}<button class="b f" onclick="X();conf()">Submit test</button>`);
}

function draw() {
  if (!T || !Q.length) return;
  T.v[T.q] = 1;
  let q = Q[T.q];
  let n = Q.length;
  let an = T.a.filter(x => x >= 0).length;
  let pgb = $("#pgb");
  if (pgb) pgb.style.width = (an / n * 100) + "%";

  let qa = $("#qa");
  if (qa) {
    qa.innerHTML = `<div class="qm"><span>Question ${T.q + 1} <small>of ${n}</small></span><span class="chip">${esc(q[4] || 'General')}</span></div>
    <h2 class="qt">${esc(q[0])}</h2>
    ${q[1].map((o, i) => `<button class="op${T.a[T.q] == i ? " on" : ""}" aria-pressed="${T.a[T.q] == i}" onclick="pick(${i})"><i>${"ABCD"[i]}</i><span>${esc(o)}</span></button>`).join("")}`;
  }

  let sd = $("#sd");
  if (sd) {
    sd.innerHTML = `<h3>Questions</h3>${plp()}<p class="sm">${an} answered · ${n - an} not answered · ${T.r.filter(x => x).length} marked</p><button class="b f" onclick="conf()">Submit test</button>`;
  }

  let xf = $("#xf");
  if (xf) {
    xf.innerHTML = `<button class="b o" aria-label="Previous" onclick="jump(T.q - 1)" ${T.q ? "" : "disabled"}>${ic("back")}</button>
    <button class="b o" onclick="T.r[T.q]^=1;sv();draw()">${ic("flag")}${T.r[T.q] ? "Unmark" : "Mark"}</button>
    ${T.q < n - 1 ? `<button class="b" onclick="jump(T.q + 1)">Next ${ic("chev")}</button>` : '<button class="b" onclick="conf()">Submit</button>'}`;
  }
}

function pick(i) {
  if (!T) return;
  T.a[T.q] = T.a[T.q] == i ? -1 : i;
  sv();
  draw();
}

function jump(i) {
  if (!T || i < 0 || i >= Q.length) return;
  lap();
  T.q = i;
  sv();
  draw();
}

addEventListener("keydown", e => {
  if (!T || !location.hash.startsWith("#take") || $("#m").innerHTML || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  let k = e.key.toLowerCase();
  if (k.length == 1 && "abcd".includes(k)) pick("abcd".indexOf(k));
  else if (k == "arrowright") jump(T.q + 1);
  else if (k == "arrowleft") jump(T.q - 1);
  else if (k == "m") { T.r[T.q] ^= 1; sv(); draw(); }
});

function conf() {
  let an = T.a.filter(x => x >= 0).length;
  let rv = T.r.filter(x => x).length;
  M(`<h3>Submit your test?</h3>
    <div class="ln"><span>Answered</span><b>${an}</b></div>
    <div class="ln"><span>Not answered</span><b>${Q.length - an}</b></div>
    <div class="ln"><span>Marked for review</span><b>${rv}</b></div>
    <button class="b f" onclick="fin()">Yes, submit</button>
    <button class="b o f" onclick="X()">Keep working</button>`);
}

function fin() {
  clearInterval(tm);
  X();
  lap();
  let c = 0, w = 0, tp = {};
  Q.forEach((q, i) => {
    let a = T.a[i];
    let topName = q[4] || 'General';
    let tObj = tp[topName] = tp[topName] || [0, 0];
    tObj[1]++;
    if (a == q[2]) {
      c++;
      tObj[0]++;
    } else if (a >= 0) {
      w++;
    }
  });

  let mPos = T.marksPos || 1;
  let mNeg = T.marksNeg || 0.33;
  let finalScore = Math.round((c * mPos - w * mNeg) * 100) / 100;
  let maxScore = Math.round((Q.length * mPos) * 100) / 100;
  
  let attObj = {
    testId: T.testId || T.nid,
    nid: T.nid,
    k: 1,
    title: T.title || (TESTS_BY_ID[T.testId]?.title || 'Practice Test'),
    questions: Q,
    a: T.a,
    tt: T.tt,
    c, w,
    u: Q.length - c - w,
    sc: finalScore,
    mx: maxScore,
    tk: Math.round((Date.now() - T.st) / 1000),
    tp,
    marksPos: mPos,
    marksNeg: mNeg,
    at: Date.now()
  };

  S.att.push(attObj);
  saveAttemptToDb(attObj);
  T = null;
  sv();
  RF = "all";
  go("result-" + (S.att.length - 1));
}

// RESULT PAGE
function result(i) {
  let r = S.att[i];
  if (!r) return go("home");
  
  let testTitle = r.title || (TESTS_BY_ID[r.testId || r.nid]?.title || (N[r.nid] ? N[r.nid].n : 'Practice Test'));
  let pc = Math.max(0, Math.round(r.sc / (r.mx || 1) * 1000) / 10);
  let ac = (r.c + r.w) ? Math.round(r.c / (r.c + r.w) * 100) : 0;
  let L = lbd(r.testId || r.nid);
  let rk = L.findIndex(l => l.me) + 1;
  let ts = Object.entries(r.tp || {}).map(([k, v]) => [k, v[0], v[1]]).sort((a, b) => (a[1] / a[2]) - (b[1] / b[2]));
  let C = 2 * Math.PI * 54;

  shell("learn", `
    <main class="w">
      <div class="rh2">
        <div class="rg">
          <svg width="132" height="132" viewBox="0 0 132 132">
            <circle cx="66" cy="66" r="54" fill="none" stroke="#ffffff30" stroke-width="10"/>
            <circle class="rc" style="--c:${C}" cx="66" cy="66" r="54" fill="none" stroke="#8fd8c6" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pc / 100)}"/>
          </svg>
          <div>${pc}%</div>
        </div>
        <div>
          <small>${esc(testTitle)}</small>
          <h2>${r.sc} / ${r.mx} marks</h2>
          <p style="margin:0;color:#cfe3dd">
            ${pc >= 75 ? "Excellent work!" : pc >= 50 ? "Good effort. Keep practising!" : "Keep practicing, you will improve!"}
            ${rk ? ` Rank ${rk} on this test.` : ''}
          </p>
        </div>
      </div>
      <div class="st">
        <div><small>Correct</small><b>${r.c}</b></div>
        <div><small>Incorrect</small><b>${r.w}</b></div>
        <div><small>Unanswered</small><b>${r.u}</b></div>
        <div><small>Accuracy</small><b>${ac}%</b></div>
        <div><small>Time taken</small><b>${mmss(r.tk)}</b></div>
        <div><small>Attempted</small><b>${r.c + r.w}/${r.c + r.w + (r.u || 0)}</b></div>
      </div>
      ${ts.length ? `
        <div class="sec" style="margin-top:26px"><h2>Topic breakdown</h2></div>
        ${ts.map(t => `<div class="ln"><span>${esc(t[0])}</span><small>${t[1]}/${t[2]} correct</small></div><div class="bar"><i style="width:${Math.round(t[1]/t[2]*100)}%"></i></div>`).join("")}
      ` : ''}
      <div class="sec" style="margin-top:30px">
        <h2>Review questions</h2>
        <span class="chip">Detailed Solutions</span>
      </div>
      <div id="rv">${rev(i)}</div>
    </main>
  `,
  `<div class="ctl"><small>Finished</small><b>${esc(testTitle)}</b></div>
  <button class="b" onclick="go('home')">Return Home</button>`,
  ["home", "Home"]);
}

function rev(i) {
  let r = S.att[i];
  if (!r) return "";
  let qList = (r.questions && r.questions.length) ? r.questions : Q;
  return `<div class="tabs">${[["all","All"],["ok","Correct"],["no","Incorrect"],["un","Skipped"]].map(f=>`<button class="${RF==f[0]?"on":""}" onclick="rfs('${f[0]}',${i})">${f[1]}</button>`).join("")}</div>` +
    (qList.map((q, k) => {
      let a = r.a[k], ok = a == q[2], st = a < 0 ? "un" : ok ? "ok" : "no";
      if (RF != "all" && RF != st) return "";
      return `<div class="rvw rs-${st}">
        <div class="rh">
          <span class="bd">${st=="ok"?"Correct":st=="no"?"Incorrect":"Skipped"}</span>
          <small>${a < 0 ? "0" : (ok ? "+" + (r.marksPos || 1) : "−" + (r.marksNeg || 0.33))} marks · ${mmss(r.tt[k] || 0)}</small>
        </div>
        <b>${k + 1}. ${esc(q[0])}</b>
        <div class="an2">${q[1].map((o, j) => `<div class="${j==q[2]?"oc":j==a?"ow":""}">${"ABCD"[j]}. ${esc(o)}${j==q[2]?" ✓":j==a?" ✗":""}</div>`).join("")}</div>
        <div class="exp"><b>Explanation:</b> ${esc(q[3] || 'Refer to study notes.')}</div>
        <button class="b o s" style="margin-top:10px" onclick="rpt('${r.testId || r.nid}', ${k})">${ic("flag")} Report an issue</button>
      </div>`;
    }).join("") || '<div class="em">Nothing in this filter.</div>');
}

function rfs(f, i) {
  RF = f;
  let rv = $("#rv");
  if (rv) rv.innerHTML = rev(i);
}

const RPR = ["The answer looks wrong", "The question is unclear", "Spelling or typing mistake", "The explanation is wrong", "Something else"];
let RPS = 0;

function rpt(testId, k, i) {
  if (i != null) RPS = i;
  else RPS = 0;
  M(`<h3>Report question ${k + 1}</h3>
    <p class="mu">What is wrong with it?</p>
    ${RPR.map((r, j) => `<button class="op${RPS == j ? " on" : ""}" style="min-height:48px" onclick="rpt('${testId}', ${k}, ${j})"><i>${j + 1}</i><span>${r}</span></button>`).join("")}
    <textarea id="rn" class="in" rows="3" placeholder="Tell us more (optional)" style="margin-top:6px"></textarea>
    <button class="b f" onclick="let note=$('#rn').value;X();sendQuestionReport('${testId}', ${k}, RPR[${RPS}], note);">Send report</button>
    <button class="b o f" onclick="X()">Cancel</button>`);
}

// MY LEARNING / LEARN PAGE

// AUTHENTICATION
function signin(cb) {
  CB = cb;
  M(`<h3>Sign in to StarzanNotes</h3>
    <p class="mu">Choose how to sign in:</p>
    <button class="b f" style="margin-bottom:10px" onclick="googleAuth()">Sign in with Google</button>
    <button class="b o f" onclick="demoAuth()">Continue as Guest Student</button>
    <button class="b o f" style="margin-top:6px" onclick="X()">Cancel</button>`);
}

async function googleAuth() {
  if (sb) {
    try {
      await sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
    } catch(err) {
      toast("Google login redirecting...");
    }
  } else {
    demoAuth();
  }
}

function demoAuth() {
  S.user = { id: 'usr_' + Date.now(), n: 'Student', e: 'student@example.com' };
  sv();
  X();
  toast("Signed in as Student");
  R();
  if (CB) CB();
}

function appSignOut() {
  if (sb) { try { sb.auth.signOut(); } catch(e) {} }
  S.user = null;
  sv();
  toast("Signed out");
  R();
}

function buy(id) {
  if (!S.user) return signin(() => buy(id));
  M(`<h3>Unlock test series</h3>
    <p class="mu">Confirm purchase with Razorpay:</p>
    <button class="b f" onclick="S.own.push('${id}');sv();X();toast('Series unlocked!');R();">Pay now (Demo)</button>
    <button class="b o f" onclick="X()">Cancel</button>`);
}

// ROUTER
function route() {
  let h = location.hash || "#home";
  let i = HS.indexOf(h);
  if (i >= 0) {
    HS.length = i + 1;
    SYNC = SY[h] || 0;
  } else {
    HS.push(h);
    SYNC = 0;
  }
  CUR = h;
  R();
}

function R() {
  clearInterval(tm);
  clearInterval(ci);
  let y = scrollY;
  let p = (location.hash.slice(1) || "home").split("-");

  if (CFG.maint) {
    A.innerHTML = `<main class="w" style="min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 18px;">
      <div style="width:72px; height:72px; border-radius:20px; background:var(--hi); color:var(--ac); display:grid; place-items:center; font-size:2rem; margin-bottom:20px;">
        ${ic("clock")}
      </div>
      <h1 style="font-family:Fraunces,Georgia,serif; font-size:clamp(1.8rem,5vw,2.4rem); margin:0 0 12px;">Under Maintenance</h1>
      <p class="mu" style="max-width:480px; font-size:1.05rem; line-height:1.6; margin:0 0 28px;">${esc(CFG.mmsg || 'We are currently updating StarzanNotes. Please check back shortly.')}</p>
      <button class="b" onclick="loadConfig(); toast('Checking status...')">Refresh Page</button>
    </main>`;
    return;
  }

  // Handle custom test taking e.g. #take-test-DC27A
  if (p[0] === 'take' && p[1] === 'test' && p[2]) {
    take();
    scrollTo(0, 0);
    return;
  }

  // Handle test overview by ID e.g. #test-DC27A
  if (p[0] === 'test' && p[1]) {
    test(p[1]);
    scrollTo(0, 0);
    return;
  }

  ({
    home,
    explore,
    learn,
    series: () => node(p[1]),
    node: () => node(p[1]),
    result: () => result(+p[1]),
    page: () => pageV(p[1])
  }[p[0]] || home)();

  scrollTo(0, SYNC >= 0 ? SYNC : y);
  SYNC = -1;
}

// SUPABASE DATA LOADERS
async function loadConfig() {
  if (!sb) return;
  try {
    const { data: cfg } = await sb.from('config').select('*').eq('id', 'main').maybeSingle();
    if (cfg) {
      if (cfg.name) CFG.name = cfg.name;
      if (cfg.tag) CFG.tag = cfg.tag;
      if (cfg.email) CFG.email = cfg.email;
      if (cfg.phone) CFG.phone = cfg.phone;
      if (cfg.wa) CFG.wa = cfg.wa;
      CFG.maint = !!cfg.maintenance;
      CFG.mmsg = cfg.maintenance_msg || CFG.mmsg;
      CFG.legal = {
        priv: cfg.legal_privacy,
        terms: cfg.legal_terms,
        about: cfg.legal_about,
        refund: cfg.legal_refund,
        help: cfg.legal_help
      };
      R();
    }
  } catch(e) { console.warn(e); }
}

async function loadBanners() {
  if (!sb) return;
  try {
    const { data: bns, error } = await sb.from('banners').select('*').eq('is_active', true).order('sort_order', { ascending: true });
    if (bns && !error) {
      FE = bns.map(b => ({
        id: b.id,
        t: b.title,
        d: b.subtitle || '',
        im: b.image_url || TH(1600, 1000, "#2b3a4a", "Exam", b.title.split(" ")[0]),
        ln: b.link ? b.link.replace(/^#/, '') : 'home'
      }));
      R();
    }
  } catch(e) { console.warn(e); }
}

async function loadSeriesAndTests() {
  if (!sb) return;
  try {
    const { data: dbTests, error } = await sb.from('tests').select('*').eq('status', 'published').order('created_at', { ascending: false });
    if (dbTests && !error) {
      LIVE_TESTS = dbTests;
      TESTS_BY_ID = {};
      dbTests.forEach(t => { TESTS_BY_ID[t.id] = t; });

      const { data: qData } = await sb.from('questions').select('test_id');
      const qMap = {};
      (qData || []).forEach(q => { qMap[q.test_id] = (qMap[q.test_id] || 0) + 1; });
      LIVE_TESTS.forEach(t => { t.qCount = qMap[t.id] || 0; });

      buildHierarchy(dbTests);
      R();
    }
  } catch(e) { console.warn(e); }
}

addEventListener("hashchange", route);
route();

// Initialize cloud data
loadConfig();
loadBanners();
loadSeriesAndTests();

</script></body></html>
